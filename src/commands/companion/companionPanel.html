            // Append the multi-step summary banner once at the bottom
            processed += '\n\n' + renderCompanionStepsSummary(steps.length, groupKey);

            return { processed, stepCount: steps.length };
        }

        function extractFileBlocks(text) {
            const blocks = [];
            if (!text || typeof text !== 'string') return blocks;

            const openTagRegex = /^[ \t]*<file\s+([^>]*?)>/gim;
            let match;

            while ((match = openTagRegex.exec(text)) !== null) {
                let start = match.index;
                const attrStr = match[1] || "";
                const bodyStart = match.index + match[0].length;

                let depth = 1;
                let isClosed = false;
                let end = text.length;
                let bodyEnd = text.length;

                const tagFinder = /<file\b([^>]*?)>|<\/file>/gi;
                tagFinder.lastIndex = bodyStart;

                let innerMatch;
                while ((innerMatch = tagFinder.exec(text)) !== null) {
                    const tag = innerMatch[0];
                    if (tag.toLowerCase() === '</file>') {
                        depth--;
                        if (depth === 0) {
                            isClosed = true;
                            bodyEnd = innerMatch.index;
                            end = innerMatch.index + tag.length;
                            break;
                        }
                    } else {
                        const innerAttr = innerMatch[1] || "";
                        if (!innerAttr.trim().endsWith('/')) {
                            depth++;
                        }
                    }
                }

                const textBefore = text.substring(0, start);
                const fenceBeforeMatch = textBefore.match(/(?:^|\n)[ \t]*(`{3,}|~{3,})(?:[a-zA-Z0-9_\-]+)?[ \t]*\r?\n[ \t]*$/);

                let fenceLen = 0;
                let fenceChar = '';
                if (fenceBeforeMatch) {
                    fenceChar = fenceBeforeMatch[1][0];
                    fenceLen = fenceBeforeMatch[1].length;
                    const matchOffsetInBefore = textBefore.length - fenceBeforeMatch[0].length;
                    const newlineIndex = fenceBeforeMatch[0].indexOf('\n');
                    start = newlineIndex !== -1 ? matchOffsetInBefore + newlineIndex + 1 : matchOffsetInBefore;
                }

                if (fenceLen > 0 && isClosed) {
                    const textAfter = text.substring(end);
                    const fenceAfterRegex = new RegExp(`^[ \\t]*(?:\\r?\\n)[ \\t]*${fenceChar}{${fenceLen},}[ \\t]*(?=\\r?\\n|$)`);
                    const fenceAfterMatch = textAfter.match(fenceAfterRegex);
                    if (fenceAfterMatch) {
                        end += fenceAfterMatch[0].length;
                    }
                }

                let rawContent = text.substring(bodyStart, bodyEnd);
                if (/^```(?:\w+)?\r?\n([\s\S]*?)\r?\n```$/s.test(rawContent.trim())) {
                    rawContent = rawContent.trim().replace(/^```(?:\w+)?\r?\n([\s\S]*?)\r?\n```$/s, '$1');
                }

                const fullMatch = text.substring(start, end);

                blocks.push({
                    attrStr: attrStr,
                    rawContent: rawContent,
                    fullMatch: fullMatch,
                    start: start,
                    end: end,
                    isClosed: isClosed
                });

                openTagRegex.lastIndex = end;
            }

            return blocks;
        }
        
        function renderHistoryBubbles(history) {
            // Render all previous history bubbles
            (history || []).forEach((msg, idx) => {
                const textContent = typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content);
                if (msg.role === 'user') {
                    renderUserBubble(textContent, 'user_' + idx);
                } else if (msg.role === 'assistant') {
                    const dom = buildMessageDOM('assistant', 'assistant_companion_msg_' + idx, textContent);
                    const responseBody = dom.body;

                    const parsed = processThinkTags(msg.content);
                    let thoughtsHtml = "";
                    if (parsed.thoughts.length > 0) {
                        parsed.thoughts.forEach((t, tIdx) => {
                            const isClosed = t.closed || true;
                            const iconHtml = isClosed ? '<span class="codicon codicon-circuit-board"></span>' : '<span class="codicon codicon-sync spin" style="color:var(--agent-core);"></span>';
                            thoughtsHtml += `<div class="plan-scratchpad" data-idx="${tIdx}">
                                <details ${!isClosed ? 'open' : ''}>
                                    <summary class="scratchpad-header">
                                        <div style="display: flex; align-items: center; gap: 6px;">
                                            ${iconHtml}
                                            <span style="font-weight: bold;">Thoughts (Reasoning)${!isClosed ? '...' : ''}</span>
                                        </div>
                                    </summary>
                                    <div class="scratchpad-content">
                                        ${DOMPurify.sanitize(marked.parse(t.content || "*AI is contemplating...*"))}
                                    </div>
                                </details>
                            </div>`;
                        });
                    }

                    let finalMarkdown = normalizeCompanionFileBlocks(parsed.processedContent, window.activeFilePath);

                    // 1. Render Structured XML <file> Mutation Cards (supports nested <file> tags)
                    const fileBlocks = extractFileBlocks(finalMarkdown);
                    for (let i = fileBlocks.length - 1; i >= 0; i--) {
                        const fb = fileBlocks[i];
                        const cardHtml = renderFileMutationCard(fb.attrStr, fb.rawContent, i);
                        finalMarkdown = finalMarkdown.substring(0, fb.start) + cardHtml + finalMarkdown.substring(fb.end);
                    }

                    // Insert Apply All banner at the bottom if there are multiple patch/write blocks
                    if (fileBlocks.length > 1) {
                        finalMarkdown = finalMarkdown + '\n\n' + renderCompanionApplyAllBanner(fileBlocks.length, idx);
                    }

                    // 1b. Render MultiSteps_TASK blocks (apply-all orchestration)
                    finalMarkdown = applyMultiStepsReplacements(finalMarkdown, 'h' + idx);

                    // 1c. Render Multi-Step Context Operation Cards (add_files_to_context / mute)
                    finalMarkdown = applyContextStepReplacements(finalMarkdown, idx).processed;

                    // 2. Render SPARQL Widgets
                    const sparqlRegex = /<query_architecture>([\s\S]*?)<\/query_architecture>/gi;
                    finalMarkdown = finalMarkdown.replace(sparqlRegex, (match, query) => {
                        const blockId = 'sparql-companion-' + Date.now();
                        return renderSparqlWidget(blockId, query.trim());
                    });

                    // 3. Render <focuse> or <focus> blocks
                    const focusRegex = /<(?:focuse|focus)>([\s\S]*?)<\/(?:focuse|focus)>/gi;
                    finalMarkdown = finalMarkdown.replace(focusRegex, (match, codeSnippet) => {
                        const trimmedCode = codeSnippet.replace(/^\r?\n/, '').replace(/\r?\n$/, '');
                        const encoded = encodeURIComponent(trimmedCode);
                        const firstLine = trimmedCode.trim().split('\n')[0] || '';
                        const preview = firstLine.length > 55 ? firstLine.substring(0, 52) + '...' : firstLine;

                        return '\n\n<div class="apply-row focus-code-row" style="background: rgba(0, 217, 181, 0.08); border-left: 3px solid var(--agent-calm, #00d9b5); border-radius: 6px; margin: 8px 0; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">\n' +
                               '  <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">\n' +
                               '    <span class="status-icon"><i class="codicon codicon-target" style="color: var(--agent-calm, #00d9b5)"></i></span>\n' +
                               '    <span style="font-size: 11px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Focus: <code style="font-size: 10.5px; opacity: 0.9;">' + escapeHtml(preview) + '</code></span>\n' +
                               '  </div>\n' +
                               '  <button class="code-action-btn apply-btn" onclick="event.stopPropagation(); focusCompanionCode(this)" data-code="' + encoded + '" style="height: 20px; font-size: 9.5px; padding: 0 8px; background: var(--agent-calm, #00d9b5) !important; color: #06222a !important; font-weight: bold; flex-shrink: 0;">\n' +
                               '    <i class="codicon codicon-selection"></i> Focus Code\n' +
                               '  </button>\n' +
                               '</div>\n\n';
                    });

                    let parsedHtml = thoughtsHtml + DOMPurify.sanitize(marked.parse(finalMarkdown), {
                        ADD_TAGS: ['div', 'pre', 'button', 'span', 'i', 'a', 'details', 'summary', 'code'],
                        ADD_ATTR: ['class', 'style', 'data-query', 'data-block-id', 'data-path', 'data-action', 'data-symbol', 'data-raw-code', 'onclick', 'open']
                    });

                    // Add a convenient Retry button if the message is a connection error
                    if (finalMarkdown.includes('Connection Error (Server Offline)')) {
                        parsedHtml += '<div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--vscode-widget-border);">' +
                            '<button class="btn secondary" onclick="retryLastUserPrompt()" style="height: 24px; font-size: 10.5px;">' +
                            '<i class="codicon codicon-sync"></i> Retry' +
                            '</button>' +
                            '</div>';
                    }

                    const actRegex = /<(open_file|select_code|set_breakpoint|run_script)\s+([^>]*?)\s*\/>/gi;
                    parsedHtml = parsedHtml.replace(actRegex, (match, action, attrStr) => {
                        const attrs = {};
                        attrStr.replace(/(\w+)=["']([^"']*)["']/g, (_, k, v) => attrs[k] = v);

                        let label = "Action";
                        let icon = "zap";
                        if (action === 'open_file') { label = 'Opening ' + (attrs.filePath ? attrs.filePath.split('/').pop() : 'file'); icon = 'file-code'; }
                        else if (action === 'select_code') { label = 'Highlighting code...'; icon = 'selection'; }
                        else if (action === 'set_breakpoint') { label = 'Breakpoint set (Line ' + attrs.line + ')'; icon = 'debug-breakpoint'; }
                        else if (action === 'run_script') { label = 'Running script...'; icon = 'play'; }

                        return `<div class="apply-row" style="background: rgba(155, 89, 182, 0.05); border-left: 3px solid var(--agent-core); margin: 6px 0; padding: 6px 10px;">
                                  <span class="status-icon"><i class="codicon codicon-${icon}" style="color: var(--agent-core)"></i></span>
                                  <span style="font-size: 11px; font-weight: bold; opacity: 0.9; margin-left: 6px;">${label}</span>
                                </div>`;
                    });

                    responseBody.innerHTML = parsedHtml;
                    container.appendChild(dom.wrapper);

                    if (typeof enhanceCodeBlocks === 'function') {
                        enhanceCodeBlocks(responseBody, 'companion_msg_' + idx, finalMarkdown, true);
                    } else {
                        Prism.highlightAllUnder(responseBody);
                    }
                }
            });
        }

        function renderStreamingBubble(streamingText) {
            // Handle current streaming response if active
            if (streamingText) {
                setFaceMood('thinking');

                // Reuse the existing streaming bubble node if we already have one;
                // only create a fresh element the first time a turn starts.
                let responseBody;
                if (_chatStreamingEl && container.contains(_chatStreamingEl)) {
                    responseBody = _chatStreamingEl.querySelector('.message-content');
                    _chatStreamingEl.dataset.originalContent = streamingText;
                } else {
                    const dom = buildMessageDOM('assistant', 'assistant_companion_msg_streaming', streamingText);
                    dom.wrapper.querySelectorAll('.robot-face').forEach(f => f.classList.add('thinking'));
                    container.appendChild(dom.wrapper);
                    _chatStreamingEl = dom.wrapper;
                    responseBody = dom.body;
                }

                const parsed = processThinkTags(streamingText);
                let thoughtsHtml = "";
                if (parsed.thoughts.length > 0) {
                    parsed.thoughts.forEach((t, tIdx) => {
                        const isClosed = t.closed;
                        const iconHtml = isClosed ? '<span class="codicon codicon-check"></span>' : '<span class="codicon codicon-sync spin" style="color:var(--agent-core);"></span>';
                        thoughtsHtml += `<div class="plan-scratchpad" data-idx="${tIdx}">
                            <details ${!isClosed ? 'open' : ''}>
                                <summary class="scratchpad-header">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        ${iconHtml}
                                        <span style="font-weight: bold;">Thoughts (Reasoning)${!isClosed ? '...' : ''}</span>
                                    </div>
                                </summary>
                                <div class="scratchpad-content">
                                    ${DOMPurify.sanitize(marked.parse(t.content || "*AI is contemplating...*"))}
                                </div>
                            </details>
                        </div>`;
                    });
                }

                let finalMarkdown = parsed.processedContent;
                let parsedHtml = thoughtsHtml + DOMPurify.sanitize(marked.parse(finalMarkdown), {
                    ADD_TAGS: ['div', 'pre', 'button', 'span', 'i', 'a'],
                    ADD_ATTR: ['class', 'style', 'data-query', 'data-block-id', 'onclick', 'data-action', 'data-path', 'data-line', 'data-text']
                });

                if (!finalMarkdown.trim() && parsed.thoughts.length === 0) {
                    parsedHtml = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
                }

                responseBody.innerHTML = parsedHtml;

                if (typeof enhanceCodeBlocks === 'function') {
                    enhanceCodeBlocks(responseBody, 'companion_msg_streaming', finalMarkdown, false);
                } else {
                    Prism.highlightAllUnder(responseBody);
                }
            } else if (_chatStreamingEl) {
                // Streaming finished/cleared and the message moved into history — drop the placeholder.
                _chatStreamingEl.remove();
                _chatStreamingEl = null;
            }
        }

        // Tracks the single active Q&A bubble so repeated chunks of the same
        // turn patch it in place instead of tearing the whole panel down.
        let _respAssistantEl = null;
        let _respPromptRendered = null;

        function renderResponse(text, prompt, isFinal = false) {
            activeContentBuffer = text;
            if (!text) {
                container.innerHTML = '<div class="empty-state">' +
                    '<div style="font-size: 26px; opacity: 0.7; margin-bottom: 8px;"><i class="codicon codicon-sparkle"></i></div>' +
                    '<h3>Lollms Companion</h3>' +
                    '<p>Ask questions, request code changes, or ask where something is defined in the current file.</p>' +
                    '</div>';
                _respAssistantEl = null;
                _respPromptRendered = null;
                return;
            }
            const parsed = processThinkTags(activeContentBuffer);
            let thoughtsHtml = "";
            if (parsed.thoughts.length > 0) {
                const latestThought = parsed.thoughts[parsed.thoughts.length - 1].content;
                const hudText = latestThought.length > 150 ? latestThought.substring(0, 150) + '...' : latestThought;
                const scratchpad = document.getElementById('hud-scratchpad-body');
                if (scratchpad) scratchpad.textContent = hudText;

                parsed.thoughts.forEach((t, idx) => {
                    const isClosed = t.closed || true;
                    const iconHtml = isClosed ? '<span class="codicon codicon-circuit-board"></span>' : '<span class="codicon codicon-sync spin" style="color:var(--agent-core);"></span>';
                    thoughtsHtml += '<div class="plan-scratchpad" data-idx="' + idx + '">' +
                        '<details ' + (!isClosed ? 'open' : '') + '>' +
                            '<summary class="scratchpad-header">' +
                                '<div style="display: flex; align-items: center; gap: 6px;">' +
                                    iconHtml +
                                    '<span style="font-weight: bold;">Thoughts (Reasoning)' + (!isClosed ? '...' : '') + '</span>' +
                                '</div>' +
                            '</summary>' +
                            '<div class="scratchpad-content">' +
                                DOMPurify.sanitize(marked.parse(t.content || "*AI is contemplating...*")) +
                            '</div>' +
                        '</details>' +
                    '</div>';
                });
            }

            let finalMarkdown = normalizeCompanionFileBlocks(parsed.processedContent, window.activeFilePath);

            // 1. Render Structured XML <file> Mutation Cards (supports nested <file> tags)
            const fileBlocks = extractFileBlocks(finalMarkdown);
            for (let i = fileBlocks.length - 1; i >= 0; i--) {
                const fb = fileBlocks[i];
                const cardHtml = renderFileMutationCard(fb.attrStr, fb.rawContent, i);
                finalMarkdown = finalMarkdown.substring(0, fb.start) + cardHtml + finalMarkdown.substring(fb.end);
            }

            if (fileBlocks.length > 1) {
                finalMarkdown = finalMarkdown + '\n\n' + renderCompanionApplyAllBanner(fileBlocks.length, 'latest');
            }

            // 1b. Render MultiSteps_TASK blocks (apply-all orchestration)
            finalMarkdown = applyMultiStepsReplacements(finalMarkdown, 'latest');

            // 1c. Render Multi-Step Context Operation Cards (add_files_to_context / mute)
            finalMarkdown = applyContextStepReplacements(finalMarkdown, 'latest').processed;

            // 2. Render SPARQL Widgets
            const sparqlRegex = /<query_architecture>([\s\S]*?)<\/query_architecture>/gi;
            finalMarkdown = finalMarkdown.replace(sparqlRegex, (match, query) => {
                const blockId = 'sparql-companion-' + Date.now();
                return renderSparqlWidget(blockId, query.trim());
            });

            // 3. Render <focuse> or <focus> blocks
            const focusRegex = /<(?:focuse|focus)>([\s\S]*?)<\/(?:focuse|focus)>/gi;
            finalMarkdown = finalMarkdown.replace(focusRegex, (match, codeSnippet) => {
                const trimmedCode = codeSnippet.replace(/^\r?\n/, '').replace(/\r?\n$/, '');
                const encoded = encodeURIComponent(trimmedCode);
                const firstLine = trimmedCode.trim().split('\n')[0] || '';
                const preview = firstLine.length > 55 ? firstLine.substring(0, 52) + '...' : firstLine;

                return '\n\n<div class="apply-row focus-code-row" style="background: rgba(0, 217, 181, 0.08); border-left: 3px solid var(--agent-calm, #00d9b5); border-radius: 6px; margin: 8px 0; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">\n' +
                       '  <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">\n' +
                       '    <span class="status-icon"><i class="codicon codicon-target" style="color: var(--agent-calm, #00d9b5)"></i></span>\n' +
                       '    <span style="font-size: 11px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Focus: <code style="font-size: 10.5px; opacity: 0.9;">' + escapeHtml(preview) + '</code></span>\n' +
                       '  </div>\n' +
                       '  <button class="code-action-btn apply-btn" onclick="event.stopPropagation(); focusCompanionCode(this)" data-code="' + encoded + '" style="height: 20px; font-size: 9.5px; padding: 0 8px; background: var(--agent-calm, #00d9b5) !important; color: #06222a !important; font-weight: bold; flex-shrink: 0;">\n' +
                       '    <i class="codicon codicon-selection"></i> Focus Code\n' +
                       '  </button>\n' +
                       '</div>\n\n';
            });

            if (container) {
                const isNewTurn = prompt !== _respPromptRendered || !_respAssistantEl || !container.contains(_respAssistantEl);

                if (isNewTurn) {
                    container.innerHTML = "";
                    if (prompt) {
                        renderUserBubble(prompt, 'user_latest');
                    }
                    const dom = buildMessageDOM('assistant', 'assistant_companion_msg', text);
                    container.appendChild(dom.wrapper);
                    _respAssistantEl = dom.wrapper;
                    _respPromptRendered = prompt;
                } else {
                    _respAssistantEl.dataset.originalContent = text;
                }

                const responseBody = _respAssistantEl.querySelector('.message-content');

                _respAssistantEl.querySelectorAll('.robot-face').forEach(f => {
                    f.classList.toggle('speaking', !isFinal);
                });

                let parsedHtml = thoughtsHtml + DOMPurify.sanitize(marked.parse(finalMarkdown), {
                    ADD_TAGS: ['div', 'pre', 'button', 'span', 'i', 'a'],
                    ADD_ATTR: ['class', 'style', 'data-query', 'data-block-id', 'onclick', 'data-action', 'data-path', 'data-line', 'data-text']
                });

                const actRegex = /<(open_file|select_code|set_breakpoint|run_script)\s+([^>]*?)\s*\/>/gi;
                parsedHtml = parsedHtml.replace(actRegex, (match, action, attrStr) => {
                    const attrs = {};
                    attrStr.replace(/(\w+)=["']([^"']*)["']/g, (_, k, v) => attrs[k] = v);

                    let label = "Action";
                    let icon = "zap";
                    if (action === 'open_file') { label = 'Opening ' + (attrs.filePath ? attrs.filePath.split('/').pop() : 'file'); icon = 'file-code'; }
                    else if (action === 'select_code') { label = 'Highlighting code...'; icon = 'selection'; }
                    else if (action === 'set_breakpoint') { label = 'Breakpoint set (Line ' + attrs.line + ')'; icon = 'debug-breakpoint'; }
                    else if (action === 'run_script') { label = 'Running script...'; icon = 'play'; }

                    return '<div class="apply-row" style="background: rgba(155, 89, 182, 0.05); border-left: 3px solid var(--agent-core); margin: 6px 0; padding: 6px 10px;">' +
                              '<span class="status-icon"><i class="codicon codicon-' + icon + '" style="color: var(--agent-core)"></i></span>' +
                              '<span style="font-size: 11px; font-weight: bold; opacity: 0.9; margin-left: 6px;">' + label + '</span>' +
                            '</div>';
                });

                responseBody.innerHTML = parsedHtml;

                if (typeof enhanceCodeBlocks === 'function') {
                    enhanceCodeBlocks(responseBody, 'companion_msg', finalMarkdown, isFinal);
                } else {
                    Prism.highlightAllUnder(responseBody);
                }

                if (isFinal) {
                    const focusMatch = text.match(/<(?:focuse|focus)>([\s\S]*?)<\/(?:focuse|focus)>/i);
                    if (focusMatch && focusMatch[1]) {
                        const codeSnippet = focusMatch[1].replace(/^\r?\n/, '').replace(/\r?\n$/, '').trim();
                        if (codeSnippet && codeSnippet !== window._lastAutoFocusedCode) {
                            window._lastAutoFocusedCode = codeSnippet;
                            vscode.postMessage({ command: 'focusCode', code: codeSnippet });
                        }
                    }
                }
                container.scrollTop = container.scrollHeight;
            }
        }

        // MultiSteps: delegated click handler for Apply All / Run Sequentially / Retry from
        document.addEventListener('click', (e) => {
            const btn = e.target && e.target.closest ? e.target.closest('[data-ms-action]') : null;
            if (!btn || btn.disabled) return;
            e.stopPropagation();
            const action = btn.dataset.msAction;
            const groupId = btn.dataset.msGroup;
            const entry = window.__multiStepsRegistry && window.__multiStepsRegistry[groupId];
            if (!entry || !entry.steps || entry.steps.length === 0) {
                btn.disabled = true;
                btn.textContent = 'No steps available';
                return;
            }
            const mode = action === 'run-sequential' ? 'sequential-reprompt' : 'patches';
            const fromIndex = action === 'retry-from' ? parseInt(btn.dataset.msFromIndex || '0', 10) : 0;

            // Freeze bar buttons synchronously to prevent double-fires
            document.querySelectorAll('.apply-multisteps-btn[data-ms-group="' + groupId + '"]').forEach(b => { b.disabled = true; });

            vscode.postMessage({
                command: 'applyAllSteps',
                groupId,
                mode,
                steps: entry.steps,
                fromIndex
            });
        });

        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.command) {
                case 'multiStepsProgress': {
                    const groupId = message.groupId;
                    const bar = document.querySelector('.apply-multisteps-bar[data-ms-group="' + groupId + '"]');
                    const progressEl = bar ? bar.querySelector('.ms-progress') : null;
                    const findCard = (k) => document.querySelector('.companion-step-card[data-multisteps-group="' + groupId + '"][data-step-number="' + k + '"]');

                    if (message.status === 'running') {
                        const c = findCard(message.current);
                        if (c) c.dataset.stepState = 'running';
                        if (progressEl) progressEl.innerHTML = '<span class="spinner" style="width:10px;height:10px;border-width:1.5px;"></span> Applying step ' + message.current + '/' + message.total + '…';
                    } else if (message.status === 'step-ok') {
                        const c = findCard(message.current);
                        if (c) c.dataset.stepState = 'ok';
                        if (progressEl) progressEl.textContent = message.current + '/' + message.total + ' applied';
                    } else if (message.status === 'error') {
                        const c = findCard(message.current);
                        if (c) c.dataset.stepState = 'error';
                        if (progressEl) {
                            const fromIdx = message.fromIndex || 0;
                            progressEl.innerHTML = '<i class="codicon codicon-error" style="color:var(--vscode-charts-red)"></i> ' +
                                escapeHtml(message.error || 'Failed') +
                                ' · <button class="apply-multisteps-btn secondary-btn" data-ms-action="retry-from" data-ms-group="' + groupId + '" data-ms-from-index="' + fromIdx + '" style="height:22px;font-size:10px;padding:0 8px;">Retry from step ' + (fromIdx + 1) + '</button>';
                        }
                        // Re-enable the top bar buttons so the user can also re-trigger manually
                        if (bar) bar.querySelectorAll('.apply-multisteps-btn').forEach(b => { if (b.dataset.msAction !== 'retry-from') b.disabled = false; });
                    } else if (message.status === 'done') {
                        if (bar) bar.querySelectorAll('.apply-multisteps-btn').forEach(b => { b.disabled = true; });
                        if (progressEl) progressEl.innerHTML = '<i class="codicon codicon-pass-filled" style="color:var(--vscode-charts-green)"></i> All ' + message.total + ' steps applied ✓';
                    }
                    break;
                }
                case 'turnEnded': {
                    try {
                        applyImplicitTurnGrouping(message.turnMessages, message.turnId);
                    } catch (e) {
                        console.warn('[Companion] turnEnded grouping failed:', e);
                    }
                    break;
                }
                case 'updateContextInfo':
                    const ctxText = document.getElementById('context-info-text');
                    if (ctxText) ctxText.textContent = message.text;
                    if (message.filePath) {
                        window.activeFilePath = message.filePath;
                    } else if (message.text && message.text !== 'No active editor') {
                        window.activeFilePath = message.text.split(' (')[0].trim();
                    }
                    break;
                case 'updateAttachState':
                    const btn = document.getElementById('attach-btn');
                    if (btn) {
                        const icon = btn.querySelector('.codicon');
                        if (message.isAttached) {
                            btn.classList.add('attached');
                            btn.title = "Pinned to context (Click to unpin)";
                            if (icon) icon.className = 'codicon codicon-pinned';
                        } else {
                            btn.classList.remove('attached');
                            btn.title = "Unpinned (Click to pin to active file)";
                            if (icon) icon.className = 'codicon codicon-pin';
                        }
                    }
                    break;
                case 'setLoading':
                    const sendBtn = document.getElementById('send-btn');
                    if (sendBtn) {
                        if (message.isLoading) {
                            sendBtn.disabled = true;
                            sendBtn.innerHTML = '<span class="codicon codicon-sync spin"></span>';
                        } else {
                            sendBtn.disabled = false;
                            sendBtn.innerHTML = '<span class="codicon codicon-send"></span>';
                            if (promptInput) promptInput.focus();
                        }
                    }
                    break;
                case 'appendChunk':
                    const w = document.getElementById('companion-waiting-placeholder');
                    if (w) w.remove();
                    appendChunk(message.text);
                    break;
                case 'renderResponse':
                    const waitPh = document.getElementById('companion-waiting-placeholder');
                    if (waitPh) waitPh.remove();
                    if (message.prompt) {
                        activePrompt = message.prompt;
                    }
                    renderResponse(message.text, message.prompt, message.isFinal);
                    break;
                case 'updateChat':
                    const waitPh2 = document.getElementById('companion-waiting-placeholder');
                    if (waitPh2) waitPh2.remove();
                    renderChat(message.history, message.streamingText);
                    break;
                case 'clearResponse':
                    if (container) container.innerHTML = "";
                    renderResponse("", "");
                    _chatHistorySig = null;
                    _chatStreamingEl = null;
                    const scratchpad = document.getElementById('hud-scratchpad-body');
                    if (scratchpad) scratchpad.textContent = 'Standing by. Ready to pair-program with you!';
                    vscode.postMessage({ command: 'clearActiveChat' });
                    break;

        function processThinkTags(content) {
            const thoughts = [];
            if (typeof content !== 'string') return { thoughts: thoughts, processedContent: '' };
            const openTags = ['<think>', '<thinking>', '<analysis>', '<reasoning>'];
            const closeTags = ['</think>', '</thinking>', '</analysis>', '</reasoning>'];

            const protectedRanges = [];
            const fenceRegex = /`{3,}[\s\S]*?(?:`{3,}|$)|`[^`\n\r]+`/g;
            let fMatch;
            while ((fMatch = fenceRegex.exec(content)) !== null) {
                protectedRanges.push({ start: fMatch.index, end: fMatch.index + fMatch[0].length });
            }

            const isProtected = (index) => {
                return protectedRanges.some(r => index >= r.start && index < r.end);
            };

            let processedContent = '';
            let remaining = content;
            let currentOffset = 0;

            while (remaining.length > 0) {
                let firstOpenIdx = -1;
                let activeOpenTag = '';
                for (let i = 0; i < openTags.length; i++) {
                    const tag = openTags[i];
                    const idx = remaining.indexOf(tag);
                    if (idx !== -1 && !isProtected(currentOffset + idx)) {
                        if (firstOpenIdx === -1 || idx < firstOpenIdx) {
                            firstOpenIdx = idx;
                            activeOpenTag = tag;
                        }
                    }
                }
                if (firstOpenIdx === -1) {
                    processedContent += remaining;
                    break;
                }
                processedContent += remaining.substring(0, firstOpenIdx);
                const activeCloseTag = activeOpenTag.replace('<', '</');
                const searchStartIdx = firstOpenIdx + activeOpenTag.length;
                let closeIdx = remaining.indexOf(activeCloseTag, searchStartIdx);
                while (closeIdx !== -1 && isProtected(currentOffset + closeIdx)) {
                    closeIdx = remaining.indexOf(activeCloseTag, closeIdx + 1);
                }
                if (closeIdx === -1) {
                    const thoughtContent = remaining.substring(searchStartIdx);
                    thoughts.push({
                        tag: activeOpenTag.replace(/[<>]/g, ''),
                        content: thoughtContent.trim(),
                        closed: false
                    });
                    break;
                }
                const thoughtContent = remaining.substring(searchStartIdx, closeIdx);
                thoughts.push({
                    tag: activeOpenTag.replace(/[<>]/g, ''),
                    content: thoughtContent.trim(),
                    closed: true
                });
                const nextOffset = closeIdx + activeCloseTag.length;
                currentOffset += nextOffset;
                remaining = remaining.substring(nextOffset);
            }
            return { thoughts: thoughts, processedContent: processedContent.trim() };
        }

        function renderFileMutationCard(attrStr, rawBody, cardIndex) {
            rawBody = (rawBody || "").trim();
            const pathRegex = /(?:^|\s+)(?:path|file_path|filepath|file|target|name|filename)\s*=\s*(?:["']([^"']+)["']|([^\s>]+))/i;
            const pathMatch = attrStr.match(pathRegex) || attrStr.match(/^(?:["']([^"']+)["']|([^\s=>"']+\.[a-zA-Z0-9_\-]+))/);
            let filePath = pathMatch ? (pathMatch[1] || pathMatch[2] || "").replace(/^['"]|['"]$/g, '').trim() : (window.activeFilePath || "current_file");
            const actionMatch = attrStr.match(/(?:action|type|mode)\s*=\s*(?:["']([^"']+)["']|([^\s>]+))/i);
            const symbolMatch = attrStr.match(/(?:symbol|function|method|class)\s*=\s*(?:["']([^"']+)["']|([^\s>]+))/i);

            const action = (actionMatch ? (actionMatch[1] || actionMatch[2]) : (rawBody.includes('<<<<<<< SEARCH') ? 'patch' : 'write')).toLowerCase();
            const symbol = symbolMatch ? (symbolMatch[1] || symbolMatch[2]).trim() : "";

            const isPatch = action === 'patch' || rawBody.includes('<<<<<<< SEARCH');
            const blockId = 'comp-block-' + Date.now() + '-' + (cardIndex !== undefined ? cardIndex : Math.random().toString(36).substring(2, 7));
            const actionLabel = isPatch ? 'SURGICAL PATCH' : (symbol ? 'SYMBOL: ' + symbol : 'WRITE FILE');
            const actionIcon = isPatch ? 'codicon-diff-modified' : (symbol ? 'codicon-symbol-method' : 'codicon-file-code');
            const ext = filePath.split('.').pop() || 'plaintext';

            let bodyHtml = "";
            if (isPatch) {
                const hunks = parseAiderHunks(rawBody);

                if (hunks.length > 0) {
                    if (hunks.length > 1) {
                        const navTabsHtml = hunks.map((h, hIdx) => {
                            return '<div class="hunk-tab hunk-tab-' + hIdx + ' ' + (hIdx === 0 ? 'active' : '') + '" onclick="event.stopPropagation(); switchCompanionTab(this, \'' + blockId + '\', ' + hIdx + ')">' +

                        const panesHtml = hunks.map((h, hIdx) => {
                            const sLines = (h.searchPart || "").replace(/\r\n/g, '\n').split('\n');
                            const rLines = (h.replacePart || "").replace(/\r\n/g, '\n').split('\n');

                            let pref = 0;
                            while (pref < sLines.length && pref < rLines.length && sLines[pref].trim() === rLines[pref].trim()) pref++;
                            let suff = 0;
                            while (suff < (sLines.length - pref) && suff < (rLines.length - pref) && sLines[sLines.length - 1 - suff].trim() === rLines[rLines.length - 1 - suff].trim()) suff++;

                                            renderDiffLines(sLines.slice(0, pref), 'unchanged') +
                                            renderDiffLines(sLines.slice(pref, sLines.length - suff), 'removed') +

                                        '<div style="font-size: 10px; opacity:0.7;">Hunk ' + (hIdx + 1) + ' of ' + hunks.length + '</div>' +
                                        '<div class="aider-hunk-actions">' +
                                            '<button class="code-action-btn apply-btn" onclick="event.stopPropagation(); applyCompanionHunk(\'' + blockId + '\', ' + hIdx + ')" title="Review Diff & Patch this hunk"><i class="codicon codicon-arrow-swap"></i> Patch Hunk</button>' +

                        bodyHtml = '<div class="hunk-tabs-container">' +
                            '<div class="hunk-tabs-nav">' + navTabsHtml + '</div>' +
                            '<div class="hunk-contents-wrapper">' + panesHtml + '</div>' +

                    } else {
                        const h = hunks[0];
                        const sLines = (h.searchPart || "").replace(/\r\n/g, '\n').split('\n');
                        const rLines = (h.replacePart || "").replace(/\r\n/g, '\n').split('\n');

                        let pref = 0;
                        while (pref < sLines.length && pref < rLines.length && sLines[pref].trim() === rLines[pref].trim()) pref++;
                        let suff = 0;
                        while (suff < (sLines.length - pref) && suff < (rLines.length - pref) && sLines[sLines.length - 1 - suff].trim() === rLines[rLines.length - 1 - suff].trim()) suff++;

                        bodyHtml = '<div class="hunk-contents-wrapper">' +

                                        renderDiffLines(sLines.slice(0, pref), 'unchanged') +
                                        renderDiffLines(sLines.slice(pref, sLines.length - suff), 'removed') +
                                        renderDiffLines(rLines.slice(pref, rLines.length - suff), 'added') +
                                        renderDiffLines(sLines.slice(sLines.length - suff), 'unchanged') +
                                    '</pre>' +
                                '</div>' +
                            '</div>' +
                        '</div>';

                } else {

            if (nav && wrapper) {

        function applyCompanionMutation(blockId, isUndo) {
            const card = document.getElementById(blockId);
            if (!card) return;

            const filePath = card.dataset.path;
            const action = card.dataset.action;
            const symbol = card.dataset.symbol;
            const rawContent = decodeURIComponent(card.dataset.rawCode || "");

            const applyBtn = card.querySelector('.apply-mutation-btn');
            const undoBtn = card.querySelector('.undo-mutation-btn');

            if (isUndo) {
                if (undoBtn) { undoBtn.disabled = true; undoBtn.innerHTML = '<div class="spinner"></div>'; }
                vscode.postMessage({
                    command: 'replaceCode',
                    filePath: filePath,
                    content: rawContent,
                    options: { undo: true, silent: true, autoSave: true, blockId: blockId }
                });
            } else {
                if (applyBtn) { applyBtn.disabled = true; applyBtn.innerHTML = '<div class="spinner"></div> Applying...'; }
                if (action === 'patch' || rawContent.includes('<<<<<<< SEARCH')) {
                    vscode.postMessage({
                        command: 'replaceCode',
                        filePath: filePath,
                        content: rawContent,
                        options: { silent: true, autoSave: true, blockId: blockId }
                    });
                } else {
                    const targetPath = symbol ? `${filePath}:${symbol}` : filePath;
                    vscode.postMessage({
                        command: 'applyFileContent',
                        filePath: targetPath,
                        content: rawContent,
                        options: { silent: true, autoSave: true, blockId: blockId }
                    });
                }
            }
        }

        function reviewCompanionDiff(blockId) {
            const card = document.getElementById(blockId);
            if (!card) return;

            const filePath = card.dataset.path;
            const action = card.dataset.action;
            const symbol = card.dataset.symbol;
            const rawContent = decodeURIComponent(card.dataset.rawCode || "");
            const diffBtn = card.querySelector('.review-diff-mutation-btn');

            if (diffBtn) {
                diffBtn.disabled = true;
                diffBtn.innerHTML = '<div class="spinner"></div> Opening...';
            }

            if (action === 'patch' || rawContent.includes('<<<<<<< SEARCH')) {
                vscode.postMessage({
                    command: 'replaceCode',
                    filePath: filePath,
                    content: rawContent,
                    options: { silent: false, autoSave: false, blockId: blockId }
                });
            } else {
                const targetPath = symbol ? `${filePath}:${symbol}` : filePath;
                vscode.postMessage({
                    command: 'applyFileContent',
                    filePath: targetPath,
                    content: rawContent,
                    options: { silent: false, autoSave: false, blockId: blockId }
                });
            }

            setTimeout(() => {
                if (diffBtn) {
                    diffBtn.disabled = false;
                    diffBtn.innerHTML = '<i class="codicon codicon-diff"></i> Diff';
                }
            }, 1200);
        }
        window.reviewCompanionDiff = reviewCompanionDiff;

        function renderSparqlWidget(blockId, queryText) {
            const escapedQuery = queryText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            setTimeout(() => {
                vscode.postMessage({
                    command: 'executeLollmsCommand',
                    details: {
                        command: 'lollms-vs-coder.runSparqlQueryDirectly',
                        params: { query: queryText, messageId: 'companion_msg', blockId: blockId }
                    }
                });
            }, 10);

            return '\n\n<div class="generation-block sparql-block" id="' + blockId + '" data-query="' + encodeURIComponent(queryText) + '" style="border: 1px solid var(--agent-core); border-radius: 8px; overflow:hidden; margin: 12px 0;">\n' +
                   '  <div class="generation-header" style="background: rgba(155, 89, 182, 0.1); padding: 8px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--vscode-widget-border);">\n' +
                   '    <span style="color: var(--agent-core); font-weight: 800; font-size:11px;"><i class="codicon codicon-graph"></i> SPARQL-lite Query (Auto-executing)</span>\n' +
                   '    <div class="code-actions" style="display:flex; gap:6px;">\n' +
                   '      <span class="codicon codicon-sync spin" style="color: var(--agent-core)"></span>\n' +
                   '    </div>\n' +
                   '  </div>\n' +
                   '  <div class="generation-body" style="padding:12px; background:var(--vscode-editor-background); display:flex; flex-direction:column; gap:8px;">\n' +
                   '    <pre style="margin:0; padding:8px; background:rgba(0,0,0,0.15); border: 1px solid var(--vscode-widget-border); border-radius:6px; font-family:monospace; font-size:11px; white-space:pre-wrap;">' + escapedQuery + '</pre>\n' +
                   '    <div class="sparql-results-render-area" style="display:block; max-height:180px; overflow-y:auto; border-top:1px solid var(--vscode-widget-border); padding-top:8px; font-size:11px;">' +
                   '       <div style="opacity:0.6; display:flex; gap:8px; align-items:center;"><div class="spinner"></div> Running query...</div>' +
                   '    </div>\n' +
                   '  </div>\n' +
                   '</div>\n\n';
        }

        function startEdit(wrapper, id, role) {
            let originalContent = wrapper.dataset.originalContent;

            if (!originalContent) {
                const contentEl = wrapper.querySelector('.message-content');
                if (contentEl) {
                    originalContent = contentEl.innerText || contentEl.textContent || "";
                }
            }

            if (typeof originalContent === 'string' && (originalContent.startsWith('"') || originalContent.startsWith('{') || originalContent.startsWith('['))) {
                try {
                    const parsed = JSON.parse(originalContent);
                    if (typeof parsed === 'string') {
                        originalContent = parsed;
                    }
                } catch {}
            }

            originalContent = (originalContent || "").trim();

            const body = wrapper.querySelector('.message-content');
            const actions = wrapper.querySelector('.message-actions');
            if (!body || !actions) return;

            const editOverlay = document.createElement('div');
            editOverlay.className = 'edit-overlay';

            const textarea = document.createElement('textarea');
            textarea.className = 'edit-textarea';
            textarea.style.cssText = "width:100%; min-height:90px; background:var(--vscode-input-background); color:var(--vscode-input-foreground); border:1px solid var(--vscode-input-border); border-radius:6px; padding:8px; font-family:var(--vscode-editor-font-family, inherit); font-size:12.5px; box-sizing:border-box; resize:vertical;";
            textarea.value = originalContent;

            const buttons = document.createElement('div');
            buttons.className = 'edit-buttons';
            buttons.style.cssText = "display:flex; justify-content:flex-end; gap:8px; margin-top:8px;";

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'edit-cancel-btn secondary';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = (e) => {
                e.stopPropagation();
                editOverlay.remove();
                actions.style.display = 'flex';
                if (role === 'user') {
                    body.textContent = originalContent;
                } else {
                    renderResponse(originalContent, activePrompt, true);
                }
            };

            const saveBtn = document.createElement('button');
            saveBtn.className = 'edit-save-btn';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = (e) => {
                e.stopPropagation();
                const newVal = textarea.value.trim();
                if (newVal) {
                    wrapper.dataset.originalContent = newVal;
                    vscode.postMessage({
                        command: 'updateMessage',
                        messageId: id,
                        newContent: newVal
                    });
                    if (role === 'user') {
                        body.textContent = newVal;
                    } else {
                        renderResponse(newVal, activePrompt, true);
                    }
                }
                editOverlay.remove();
                actions.style.display = 'flex';
            };

            if (role === 'user') {
                const resubmitBtn = document.createElement('button');
                resubmitBtn.className = 'edit-save-btn apply-btn';
                resubmitBtn.innerHTML = '<span class="codicon codicon-send"></span> Save & Ask';
                resubmitBtn.onclick = (e) => {
                    e.stopPropagation();
                    const newVal = textarea.value.trim();
                    if (newVal) {
                        wrapper.dataset.originalContent = newVal;
                        body.textContent = newVal;

                        // Truncate any subsequent messages in the DOM so the stream cleanly restarts
                        let next = wrapper.nextElementSibling;
                        while (next) {
                            const toRemove = next;
                            next = next.nextElementSibling;
                            toRemove.remove();
                        }

                        renderStreamingBubble('');
                        container.scrollTop = container.scrollHeight;

                        vscode.postMessage({
                            command: 'saveAndAsk',
                            messageId: id,
                            text: newVal
                        });
                    }
                    editOverlay.remove();
                    actions.style.display = 'flex';
                };

                textarea.onkeydown = (e) => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.shiftKey)) {
                        e.preventDefault();
                        resubmitBtn.click();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        cancelBtn.click();
                    }
                };

                buttons.append(cancelBtn, saveBtn, resubmitBtn);
            } else {
                textarea.onkeydown = (e) => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                        e.preventDefault();
                        saveBtn.click();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        cancelBtn.click();
                    }
                };
                buttons.append(cancelBtn, saveBtn);
            }

            editOverlay.append(textarea, buttons);

            body.innerHTML = '';
            body.appendChild(editOverlay);
            actions.style.display = 'none';
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }

        function enhanceCodeBlocks(container, messageId, contentSource, isFinal = false) {
            const pres = container.querySelectorAll('pre');
            pres.forEach((pre, index) => {
                const code = pre.querySelector('code');
                if (!code || pre.parentElement?.classList.contains('code-collapsible')) return;

                const langMatch = code.className.match(/language-(\S+)/);
                let language = langMatch ? langMatch[1] : 'plaintext';
                let filePath = '';

                if (language.includes(':')) {
                    const parts = language.split(':');
                    language = parts[0];
                    filePath = parts.slice(1).join(':').trim();
                }

                const codeText = code.innerText;
                const isAider = codeText.includes('<<<<<<< SEARCH') && codeText.includes('>>>>>>> REPLACE');

                const details = document.createElement('details');
                details.className = 'code-collapsible';
                details.open = true;
                details.id = 'block-comp-' + messageId + '-' + index;

                const summary = document.createElement('summary');
                summary.className = 'code-summary';

                const label = document.createElement('div');
                label.className = 'summary-lang-label';
                label.innerHTML = '<span class="lang-badge">' + language + '</span>' + (filePath ? ' : <span class="path-display-label">' + filePath + '</span>' : '');
                summary.appendChild(label);

                const actions = document.createElement('div');
                actions.className = 'code-actions';
                summary.appendChild(actions);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-action-btn';
                copyBtn.innerHTML = '<span class="codicon codicon-copy"></span>';
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    vscode.postMessage({ command: 'copyToClipboard', text: codeText });
                };
                actions.appendChild(copyBtn);

                if (filePath) {
                    const applyBtn = document.createElement('button');
                    applyBtn.className = 'code-action-btn apply-btn';
                    applyBtn.innerHTML = '<span class="codicon ' + (isAider ? 'codicon-arrow-swap' : 'codicon-tools') + '"></span>';
                    applyBtn.onclick = (e) => {
                        e.stopPropagation();
                        const cmd = isAider ? 'replaceCode' : 'applyFileContent';
                        vscode.postMessage({
                            command: cmd,
                            filePath: filePath,
                            content: codeText,
                            options: { silent: false, blockId: details.id, hunkIndex: index }
                        });
                    };
                    actions.appendChild(applyBtn);
                }

                details.appendChild(summary);
                pre.replaceWith(details);
                details.appendChild(pre);

                if (typeof Prism !== 'undefined') {
                    Prism.highlightElement(code);
                }
            });
        }

        function reviewDecision(blockId, decision, filePath) {
            vscode.postMessage({
                command: 'reviewDecision',
                blockId: blockId,
                decision: decision,
                filePath: filePath
            });
            const card = document.getElementById(blockId);
            if (card) {
                const reviewBox = card.querySelector('.review-card, .review-actions-row');
                if (reviewBox) reviewBox.remove();
            }
        }

        function applyCompanionHunk(blockId, hIdx) {
            const card = document.getElementById(blockId);
            if (!card) return;

            const filePath = card.dataset.path;
            const rawContent = decodeURIComponent(card.dataset.rawCode || "");
            const hunks = parseAiderHunks(rawContent);

            if (hIdx >= 0 && hIdx < hunks.length) {
                const hunk = hunks[hIdx];
                const hunkBtn = card.querySelector('.hunk-pane-' + hIdx + ' .apply-btn');
                if (hunkBtn) {
                    hunkBtn.disabled = true;
                    hunkBtn.innerHTML = '<div class="spinner"></div>';
                }

                vscode.postMessage({
                    command: 'replaceCode',
                    filePath: filePath,
                    content: hunk.fullMatch,
                    options: {
                        silent: false,
                        autoSave: false,
                        blockId: blockId,
                        hunkIndex: hIdx
                    }
                });
            }
        }

        function wrapText(type) {
            const textarea = document.getElementById('prompt-input');
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);

            let prefix = '';
            let suffix = '';

            switch (type) {
                case 'python':
                    prefix = '```python\n';
                    suffix = '\n```';
                    break;
                case 'code':
                    prefix = '```\n';
                    suffix = '\n```';
                    break;
                case 'h1':
                    prefix = '# ';
                    break;
                case 'h2':
                    prefix = '## ';
                    break;
                case 'h3':
                    prefix = '### ';
                    break;
                case 'list':
                    prefix = '- ';
                    break;
                case 'bold':
                    prefix = '**';
                    suffix = '**';
                    break;
                case 'italic':
                    prefix = '*';
                    suffix = '*';
                    break;
            }

            const replacement = prefix + (selectedText || (type.startsWith('h') ? 'Heading' : 'text')) + suffix;
            textarea.setRangeText(replacement, start, end, 'select');
            textarea.focus();
        }

        // Sync the avatar's heartbeat speed/color with the Symbiosis value
        // already shown in the markup, so the very first frame is consistent.
        updateTrustScore(75);

        // Global Exports for DOM actions
        window.toggleHistory = toggleHistory;
        window.toggleAttach = toggleAttach;
        window.clearHistory = () => vscode.postMessage({ command: 'clearHistory' });
        window.submitPrompt = submitPrompt;

        window.copyFullResponse = () => vscode.postMessage({ command: 'copyToClipboard', text: activeContentBuffer });
        window.clearResponse = clearResponse;
        window.startEdit = startEdit;
        window.enhanceCodeBlocks = enhanceCodeBlocks;
        window.reviewDecision = reviewDecision;
        window.applyCompanionHunk = applyCompanionHunk;
        window.applyCompanionMutation = applyCompanionMutation;
        window.switchCompanionTab = switchCompanionTab;
        window.wrapText = wrapText;
        window.renderCompanionApplyAllBanner = renderCompanionApplyAllBanner;
        window.reviewCompanionDiff = reviewCompanionDiff;

        function validateCompanionDiff(blockId, isAccept, filePath) {
            const card = document.getElementById(blockId);
            const reviewRow = document.getElementById('review-row-' + blockId);
            if (reviewRow) reviewRow.remove();

            if (isAccept) {
                vscode.postMessage({
                    command: 'acceptDiff',
                    blockId: blockId,
                    filePath: filePath
                });
            } else {
                vscode.postMessage({
                    command: 'rejectDiff',
                    blockId: blockId,
                    filePath: filePath
                });
            }
        }
        window.validateCompanionDiff = validateCompanionDiff;

        function retryCompanionRepair(blockId, filePath) {
            const card = document.getElementById(blockId);
            if (!card) return;
            const errBanner = card.querySelector('.apply-failed-banner');
            if (errBanner) errBanner.remove();

            const applyBtn = card.querySelector('.apply-mutation-btn, .apply-btn');
            if (applyBtn) {
                applyBtn.disabled = true;
                applyBtn.innerHTML = '<div class="spinner"></div> Repairing...';
            }

            const rawContent = decodeURIComponent(card.dataset.rawCode || "");

            vscode.postMessage({
                command: 'replaceCode',
                filePath: filePath || card.dataset.path,
                content: 'REPAIR_REQUESTED',
                options: { blockId: blockId, silent: true, autoSave: true, failingPatch: rawContent }
            });
        }
        window.retryCompanionRepair = retryCompanionRepair;
        window.loadHistory = (id) => {
            vscode.postMessage({ command: 'loadHistory', id: id });
            toggleHistory();
        };
        window.deleteHistory = (e, id) => {
            e.stopPropagation();
            vscode.postMessage({ command: 'deleteHistory', id: id });
        };

        function focusCompanionCode(btn) {
            const raw = btn.getAttribute('data-code');
            if (raw) {
                const code = decodeURIComponent(raw);
                vscode.postMessage({ command: 'focusCode', code: code });
            }
        }
        window.focusCompanionCode = focusCompanionCode;

        // Notify extension that the webview is ready to receive state
        vscode.postMessage({ command: 'webview-ready' });
    </script>
</body>
