
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        style-src 'unsafe-inline' {{cspSource}} https://cdn.jsdelivr.net;
        font-src {{cspSource}} https://cdn.jsdelivr.net;
        img-src {{cspSource}} data: blob:;
        script-src 'nonce-{{nonce}}' {{cspSource}} https://cdn.jsdelivr.net;
        connect-src {{cspSource}} https:;
    ">
    <title>Lollms Companion</title>
    <link href="{{codiconUri}}" rel="stylesheet" />
    <link href="{{cssUri}}" rel="stylesheet" />
    <link href="{{prismThemeUri}}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer nonce="{{nonce}}" src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer nonce="{{nonce}}" src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-font-family);
        }

        .companion-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* Flexible header: never clip when the actions row wraps */
        .companion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            background-color: var(--vscode-sideBarSectionHeader-background);
            border-bottom: 1px solid var(--vscode-widget-border);
            flex-shrink: 0;
            min-height: 36px;
            box-sizing: border-box;
            flex-wrap: nowrap;
            gap: 6px;
        }

        .companion-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 0 1 auto;
        }

        .companion-title {
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .companion-badge {
            font-size: 10px;
            padding: 1px 7px;
            border-radius: 10px;
            background: rgba(0, 122, 204, 0.14);
            border: 1px solid rgba(0, 122, 204, 0.35);
            color: var(--vscode-textLink-foreground);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Actions must be allowed to grow/wrap without being cropped */
        .companion-actions {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-wrap: nowrap;
            justify-content: flex-end;
            min-width: 0;
            flex-shrink: 1;
        }

        .companion-actions > * {
            flex-shrink: 0;
        }

        /* Wider, clearly visible model dropdown */
        .companion-model-select {
            min-width: 110px;
            max-width: 200px;
            flex: 1 1 auto;
            height: 24px;
            line-height: 22px;
            font-size: 11px;
            font-weight: 600;
            background: var(--vscode-dropdown-background, var(--vscode-input-background));
            color: var(--vscode-dropdown-foreground, var(--vscode-input-foreground));
            border: 1px solid var(--vscode-dropdown-border, var(--vscode-input-border));
            border-radius: 4px;
            padding: 0 4px;
            cursor: pointer;
            outline: none;
        }

        .companion-model-select:focus {
            border-color: var(--vscode-focusBorder);
        }

        .companion-thinking .thinking-dots span {
            opacity: 0;
            animation-delay: 0.2s;
        }
        .companion-thinking .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes Blink {
            0%, 100% { opacity: 0; }
            20% { opacity: 1; }
        }
        .streaming-cursor {
            display: inline-block;
            margin-left: 2px;
            color: var(--vscode-textLink-foreground);
            animation: cursorBlink 1s step-start infinite;
        }
        @keyframes cursorBlink {
            50% { opacity: 0; }
        }

        .companion-header .icon-btn {
            width: 24px;
            height: 24px;
            min-width: 24px;
            flex: 0 0 24px;
            padding: 0;
            border-radius: 4px;
            background: transparent;
            border: none;
            color: var(--vscode-icon-foreground);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .companion-header .icon-btn .codicon {
            font-size: 14px;
            line-height: 1;
        }

        .companion-header .icon-btn:hover {
            background-color: var(--vscode-toolbar-hoverBackground);
            color: var(--vscode-foreground);
        }

        #attach-btn.attached {
            background-color: var(--vscode-button-background) !important;
            color: var(--vscode-button-foreground) !important;
        }

        #clear-chat-btn:hover {
            color: var(--vscode-errorForeground) !important;
            background-color: rgba(244, 71, 71, 0.14) !important;
        }

        .companion-context-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            background-color: var(--vscode-editorWidget-background);
            border-bottom: 1px solid var(--vscode-widget-border);
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background-color 0.12s ease;
        }

        .companion-context-bar:hover {
            background-color: var(--vscode-list-hoverBackground);
            color: var(--vscode-foreground);
        }

        #markdown-content.messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            height: auto;
        }

        .msg-collapse-btn {
            background: transparent;
            border: none;
            color: var(--vscode-foreground);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            margin-right: 4px;
        }

        .msg-collapse-btn:hover {
            opacity: 1;
            background: var(--vscode-toolbar-hoverBackground);
        }

        .message-wrapper.collapsed-message .message-content {
            display: none !important;
        }

        .message-wrapper.collapsed-message .message {
            padding-bottom: 6px !important;
            min-height: auto !important;
            opacity: 0.85;
        }

        .message-wrapper.collapsed-message .message:hover {
            opacity: 1;
        }

        .companion-main .message {
            margin: 5px 10px;
            padding: 10px 14px;
            width: calc(100% - 20px);
        }

        .companion-main .message-header {
            margin-bottom: 4px;
        }

        .companion-main .markdown-body {
            font-size: 12.5px;
            line-height: 1.5;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            max-width: 300px;
            color: var(--vscode-descriptionForeground);
            padding: 24px 16px;
        }

        .empty-state h3 {
            color: var(--vscode-foreground);
            font-size: 14px;
            margin: 0 0 8px 0;
        }

        .empty-state p {
            font-size: 11.5px;
            line-height: 1.55;
            margin: 0;
        }

        .companion-input-wrapper {
            padding: 8px 10px 10px 10px;
            border-top: 1px solid var(--vscode-widget-border);
            background-color: var(--vscode-sideBar-background);
            flex-shrink: 0;
        }

        .companion-input-wrapper .input-area-container {
            gap: 0;
            border: 1px solid var(--vscode-input-border);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--vscode-input-background);
        }

        .companion-input-wrapper .input-area-container:focus-within {
            border-color: var(--vscode-focusBorder);
        }

        .companion-input-wrapper .rich-input-toolbar {
            border: none;
            border-radius: 0;
            border-bottom: 1px solid var(--vscode-widget-border);
            padding: 3px 6px;
            background-color: var(--vscode-editorWidget-background);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px;
            overflow: visible;
            max-height: none;
            min-height: 28px;
        }

        /* Local override so the toolbar chips never get cropped by external CSS */
        .companion-input-wrapper .rich-input-toolbar .toolbar-tool {
            height: 22px;
            min-height: 22px;
            padding: 2px 6px;
            font-size: 10.5px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-sizing: border-box;
        }

        .companion-input-wrapper .input-area {
            border: none;
            border-radius: 0;
            padding: 6px 8px;
            background: transparent;
        }

        .companion-input-wrapper .input-row {
            align-items: flex-end;
            gap: 8px;
        }

        .companion-input-wrapper textarea {
            flex: 1;
            min-height: 36px;
            max-height: 160px;
            resize: none;
            background: transparent;
            color: var(--vscode-input-foreground);
            border: none;
            outline: none;
            font-family: var(--vscode-font-family);
            font-size: 12.5px;
            line-height: 1.45;
            padding: 4px;
        }

        .companion-input-wrapper .control-buttons {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 4px;
            margin-bottom: 0;
        }

        #attach-image-btn {
            background: transparent;
            color: var(--vscode-icon-foreground);
            border: 1px solid transparent;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #attach-image-btn:hover {
            background-color: var(--vscode-toolbar-hoverBackground);
            color: var(--vscode-foreground);
        }

        #send-btn {
            background-color: var(--vscode-button-background) !important;
            color: var(--vscode-button-foreground) !important;
            border: none !important;
            border-radius: 4px !important;
            width: 32px !important;
            height: 30px !important;
            padding: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
        }

        #send-btn:hover {
            background-color: var(--vscode-button-hoverBackground) !important;
        }

        #send-btn.is-stopping {
            background-color: var(--vscode-charts-red, #e51400) !important;
            color: #ffffff !important;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background-color: var(--vscode-sideBar-background);
            border-right: 1px solid var(--vscode-widget-border);
            z-index: 10000;
            transform: translateX(-100%);
            transition: transform 0.22s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar.visible {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9999;
            display: none;
        }

        .sidebar-overlay.visible {
            display: block;
        }

        .sidebar-header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--vscode-widget-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            background-color: var(--vscode-sideBarSectionHeader-background);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .history-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--vscode-widget-border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item:hover {
            background-color: var(--vscode-list-hoverBackground);
        }

        .history-prompt {
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            opacity: 0.7;
        }

        .history-delete-btn {
            background: transparent;
            border: none;
            color: var(--vscode-errorForeground);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .raw-stitch-mutation-btn,
        .raw-hunk-btn {
            display: none !important;
        }

        .review-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(0, 122, 204, 0.12);
            border-top: 1px solid var(--vscode-widget-border);
        }

        .review-btn-accept {
            background: var(--vscode-charts-green, #2ecc71) !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .review-btn-reject {
            background: var(--vscode-charts-red, #e74c3c) !important;
            color: #ffffff !important;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Companion History</span>
            <div style="display:flex; gap:4px; align-items:center;">
                <button type="button" id="clear-history-btn" class="code-action-btn secondary-btn" style="height:20px; font-size:10px; padding:0 6px;">Clear</button>
                <button type="button" id="close-sidebar-btn" class="icon-btn" title="Close"><i class="codicon codicon-close"></i></button>
            </div>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="companion-main">
        <div class="companion-header">
            <div class="companion-header-left">
                <button type="button" id="toggle-history-btn" class="icon-btn" title="Companion History">
                    <span class="codicon codicon-history"></span>
                </button>
                <span class="codicon codicon-sparkle" style="color: var(--vscode-textLink-foreground);"></span>
                <span class="companion-title">Lollms Companion</span>
                <span class="companion-badge" title="Sees active file, current selection, and prompt history; recovers other files via grep/search/symbol lookup">
                    <span class="codicon codicon-zap"></span> Light
                </span>
            </div>
            <div class="companion-actions">
                <select id="companion-model-select" class="companion-model-select" title="Active Model">
                    <option value="">Loading models…</option>
                </select>
                <button type="button" id="refresh-models-btn" class="icon-btn" title="Refresh models list">
                    <span class="codicon codicon-refresh"></span>
                </button>
                <button type="button" id="attach-btn" class="icon-btn" title="Follow active file (Click to pin)">
                    <span class="codicon codicon-pin"></span>
                </button>
                <button type="button" id="copy-full-btn" class="icon-btn" title="Copy conversation markdown">
                    <span class="codicon codicon-copy"></span>
                </button>
                <button type="button" id="clear-chat-btn" class="icon-btn" title="Clear active chat">
                    <span class="codicon codicon-trash"></span>
                </button>
            </div>
        </div>

        <div class="companion-context-bar" id="companion-context-bar" title="Active File & Selection Context (Click to reveal in editor)">
            <span class="codicon codicon-file-code" style="color: var(--vscode-textLink-foreground); flex-shrink:0;"></span>
            <span id="context-info-text">{{initialContextInfo}}</span>
        </div>

        <div class="messages" id="markdown-content"></div>

        <div class="companion-input-wrapper">
            <div class="input-area-container">
                <div class="rich-input-toolbar">
                    <button type="button" class="toolbar-tool" id="attach-image-btn" title="Attach Image (or paste with Ctrl+V)"><i class="codicon codicon-file-media"></i><span>Image</span></button>
                    <input type="file" id="companion-image-input" accept="image/*" multiple style="display: none;" />
                    <div class="toolbar-separator"></div>
                    <button type="button" class="toolbar-tool" data-wrap="python" title="Python Block"><i class="codicon codicon-symbol-method"></i><span>Python</span></button>
                    <button type="button" class="toolbar-tool" data-wrap="code" title="Code Block"><i class="codicon codicon-code"></i><span>Code</span></button>
                    <div class="toolbar-separator"></div>
                    <button type="button" class="toolbar-tool" data-wrap="h1" title="Heading 1"><span>H1</span></button>
                    <button type="button" class="toolbar-tool" data-wrap="h2" title="Heading 2"><span>H2</span></button>
                    <div class="toolbar-separator"></div>
                    <button type="button" class="toolbar-tool" data-wrap="list" title="Bullet List"><i class="codicon codicon-list-unordered"></i></button>
                    <button type="button" class="toolbar-tool" data-wrap="bold" title="Bold"><i class="codicon codicon-bold"></i></button>
                    <button type="button" class="toolbar-tool" data-wrap="italic" title="Italic"><i class="codicon codicon-italic"></i></button>
                </div>
                <div class="input-area" id="companion-input-area">
                    <div id="attachment-preview-area" class="attachment-preview-area" style="display: none;"></div>
                    <div class="input-row">
                        <textarea id="prompt-input" placeholder="Ask about this file/selection, paste images (Ctrl+V), or request edits..."></textarea>
                        <div class="control-buttons">
                            <button type="button" id="send-btn" title="Send Message (Enter)">
                                <span class="codicon codicon-send"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="image-zoom-overlay">
        <div class="zoom-controls">
            <button type="button" class="code-action-btn secondary-btn" id="zoom-copy-btn" title="Copy image data">
                <i class="codicon codicon-copy"></i>
            </button>
            <button type="button" class="code-action-btn secondary-btn" id="zoom-close-btn" title="Close (Esc)">
                <i class="codicon codicon-close"></i>
            </button>
        </div>
        <img id="zoomed-image-display" alt="Zoomed View">
    </div>

    <script nonce="{{nonce}}" src="{{bundleUri}}"></script>
</body>
</html>
