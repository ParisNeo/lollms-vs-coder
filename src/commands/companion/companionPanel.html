<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        style-src 'unsafe-inline' {{cspSource}} https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        font-src {{cspSource}} https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        img-src {{cspSource}} data:;
        script-src 'unsafe-inline' 'unsafe-eval' {{cspSource}} https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        connect-src https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
    ">
    <title>Lollms Companion</title>
    <!-- KaTeX Math Typesetting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script {{nonce}} src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script {{nonce}} src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Essential Libraries -->
    <script {{nonce}} src="https://cdn.jsdelivr.net/npm/marked@5.1.1/marked.min.js"></script>
    <script {{nonce}} src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="{{codiconUri}}" rel="stylesheet" />
    <link href="{{cssUri}}" rel="stylesheet" />

    <script {{nonce}} src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script {{nonce}} src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script {{nonce}} src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script {{nonce}} src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script {{nonce}} src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-diff.min.js"></script>

    <style>
        /* ============================================================
           PROFESSIONAL VS CODE THEME INTEGRATION
           Clean, elegant, non-distracting UI matching the active theme.
        :root {
            --code-bg: var(--vscode-editor-background);
            --code-header-bg: var(--vscode-editorWidget-background);
            --code-border: var(--vscode-widget-border);

            --accent: var(--vscode-textLink-foreground, #3794ff);
            --accent-hover: var(--vscode-textLink-activeForeground, #1e88e5);

            --success-fg: var(--vscode-charts-green, #388e3c);
            --error-fg: var(--vscode-charts-red, #e51400);

            --bubble-radius: 8px;
            --shadow-soft: 0 1px 4px rgba(0, 0, 0, 0.15);
            --shadow-lift: 0 4px 14px rgba(0, 0, 0, 0.22);
        }

        * { box-sizing: border-box; }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-background);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-hoverBackground);
        }

        /* --- COMPANION COMPACT SPACE SAVING OVERRIDES --- */
        .markdown-body {
            font-size: 12.5px !important;
            line-height: 1.5 !important;
        }

        .markdown-body p, .markdown-body ul, .markdown-body ol {
            margin-top: 0 !important;
            margin-bottom: 6px !important;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-size: 13px !important;
            margin-top: 10px !important;
            margin-bottom: 6px !important;
        }

        .processing-block { margin: 6px 0 !important; }
        .processing-header { padding: 6px 8px !important; font-size: 10px !important; }
        .processing-body { padding: 8px !important; font-size: 10px !important; max-height: 120px !important; }

        /* Clean Companion Avatar Badge */
        .companion-avatar {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .robot-face {
            width: 20px;
            height: 16px;
            background: #201a26;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 3px;
            box-sizing: border-box;
            border: 1px solid var(--bond-color);
            box-shadow: 0 0 8px rgba(155, 89, 182, 0.35), inset 0 0 6px rgba(155, 89, 182, 0.15);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            animation: face-breathe 3.4s ease-in-out infinite;
        }

        @keyframes face-breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-0.5px) scale(1.03); }
        }

        .robot-face.speaking {
            border-color: var(--agent-pulse);
            box-shadow: 0 0 12px rgba(255, 46, 136, 0.55);
            animation: face-talk 0.42s ease-in-out infinite alternate;
        }

        @keyframes face-talk {
            from { transform: scaleY(1); }
            to { transform: scaleY(1.08); }
        }

        .robot-face.thinking {
            border-color: var(--agent-core);
            box-shadow: 0 0 12px rgba(155, 89, 182, 0.6);
            animation: brain-throb 1.1s infinite ease-in-out;
        }

        .robot-face.error { border-color: var(--error-fg); box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        .robot-face.success {
            border-color: var(--success-fg);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
            animation: face-cheer 0.5s ease-in-out 2;
        }

        @keyframes face-cheer {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-2.5px) rotate(-6deg); }
            75% { transform: translateY(-2.5px) rotate(6deg); }
        }

        @keyframes brain-throb {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .robot-eye {
            width: 3px;
            height: 3px;
            background: var(--agent-calm);
            border-radius: 50%;
            box-shadow: 0 0 4px var(--agent-calm);
            animation: eye-blink 4.6s infinite;
        }

        /* Two eyes blink slightly out of sync — a small imperfection that
           reads as "alive" rather than a mechanical, synchronized flicker. */
        .robot-eye:nth-child(2) { animation-duration: 5.3s; animation-delay: 0.6s; }

        .robot-face.thinking .robot-eye {
            background: var(--agent-core);
            box-shadow: 0 0 5px var(--agent-core);
            animation: eye-scan 1.1s ease-in-out infinite;
        }

        .robot-face.speaking .robot-eye {
            background: var(--agent-pulse);
            box-shadow: 0 0 5px var(--agent-pulse);
        }

        .robot-face.success .robot-eye {
            background: var(--agent-warm);
            box-shadow: 0 0 6px var(--agent-warm);
        }

        @keyframes eye-scan {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-1.5px); opacity: 0.5; }
        }

        /* A gently curved smile instead of a flat line — the single
           friendliest change on the whole face. */
        .robot-mouth {
            position: absolute;
            bottom: 2.5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 4px;
            background: transparent !important;
            border: none;
            border-bottom: 1.5px solid var(--agent-calm);
            border-radius: 0 0 8px 8px;
            transition: all 0.2s ease;
        }

        .robot-face.speaking .robot-mouth {
            border-bottom-color: var(--agent-pulse);
            border-radius: 4px;
            animation: mouth-flap 0.28s ease-in-out infinite alternate;
        }

        .robot-face.success .robot-mouth {
            border-bottom-color: var(--agent-warm);
            width: 10px;
            height: 5px;
        }

        @keyframes mouth-flap {
            from { height: 3px; width: 7px; border-radius: 4px; }
            to { height: 4px; width: 4px; border-radius: 50%; }
        }

        @keyframes eye-blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        /* A little cheer — like a friend's quick smile of approval — when a
           patch lands or a review is accepted. Toggled briefly by JS. */
        .friend-avatar-container.celebrate::after,
        .mini-face.celebrate::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--agent-warm);
            opacity: 0;
            animation: spark-ring 0.7s ease-out;
            pointer-events: none;
        }

        @keyframes spark-ring {
            0% { transform: scale(0.6); opacity: 0.9; border-color: var(--agent-warm); }
            60% { border-color: var(--agent-warm-2); }
            100% { transform: scale(1.7); opacity: 0; }
        }

        /* ============================================================
           SYMBIOSIS METER — animated shimmering gradient bar
           ============================================================ */
        .affective-matrix {
            margin: 0 16px 10px 16px;
            padding: 9px 12px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.06), rgba(255, 46, 136, 0.03));
            border: 1px solid var(--code-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }

        .matrix-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            color: var(--agent-core);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        #matrix-score-val {
            color: var(--vscode-descriptionForeground);
            font-weight: 700;
        }

        .matrix-bar {
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        .matrix-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--agent-calm), var(--agent-core) 55%, var(--agent-pulse));
            background-size: 200% 100%;
            width: 75%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            animation: shimmer-flow 3.5s linear infinite;
        }

        @keyframes shimmer-flow {
            0% { background-position: 0% 0%; }
            100% { background-position: -200% 0%; }
        }

        /* ============================================================
           SCRATCHPAD (HUD)
           ============================================================ */
        .friendship-hud {
            margin: 0 16px 12px 16px;
            border: 1px solid var(--code-border);
            border-radius: 8px;
            background: rgba(155, 89, 182, 0.03);
            overflow: hidden;
            flex-shrink: 0;
        }

        .hud-header {
            padding: 7px 12px;
            font-size: 11px;
            font-weight: bold;
            color: var(--agent-core);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(155, 89, 182, 0.06);
            border-bottom: 1px solid var(--code-border);
            cursor: pointer;
            user-select: none;
            list-style: none;
        }

        .hud-header::-webkit-details-marker { display: none; }
        .hud-header::marker { display: none; content: ''; }

        .hud-header::after {
            content: '\eab4';
            font-family: 'codicon';
            font-size: 12px;
            opacity: 0.7;
            transition: transform 0.2s ease;
        }

        .friendship-hud details:not([open]) .hud-header::after { transform: rotate(-90deg); }

        .hud-scroll-container {
            padding: 10px 14px;
            font-size: 11px;
            max-height: 120px;
            overflow-y: auto;
            color: var(--vscode-descriptionForeground);
            line-height: 1.5;
        }

        /* ============================================================
           COGNITIVE MODE TOGGLE
           ============================================================ */
        .cognitive-toolbar {
            display: flex;
            gap: 6px;
            margin: 0 16px 10px 16px;
            background: rgba(0, 0, 0, 0.22);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--code-border);
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .cognitive-pill {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            border-radius: 18px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--vscode-foreground);
            user-select: none;
        }

        .cognitive-pill:hover { opacity: 0.9; background: rgba(255, 255, 255, 0.05); }

        .cognitive-pill.active {
            opacity: 1;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            transform: scale(1.03);
        }

        #pill-grounding.active { background: linear-gradient(135deg, var(--agent-calm), #0891b2) !important; color: #06222a !important; }

        #pill-move37.active {
            background: linear-gradient(135deg, var(--agent-core), var(--agent-pulse)) !important;
            color: white !important;
            box-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            animation: move37-pulse 1.4s infinite alternate;
        }

        @keyframes move37-pulse {
            from { box-shadow: 0 0 10px rgba(155, 89, 182, 0.4), 0 0 20px rgba(255, 46, 136, 0.2); }
            to { box-shadow: 0 0 16px rgba(155, 89, 182, 0.85), 0 0 32px rgba(255, 46, 136, 0.45); }
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area-wrapper {
            padding: 12px 16px 16px 16px;
            background-color: var(--vscode-sideBar-background);
            border-top: 1px solid var(--vscode-panel-border);
            position: relative;
            z-index: 6000;
            overflow: visible !important;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            background-color: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border);
            border-radius: 14px;
            padding: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-area:focus-within {
            border-color: var(--vscode-focusBorder);
        }

        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }

        .attachment-preview-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid var(--vscode-widget-border);
            margin-bottom: 8px;
        }

        .attachment-preview-area:empty { display: none; }

        .staged-image-card {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            border: 1px solid var(--vscode-widget-border);
            background-size: cover;
            background-position: center;
            background-color: var(--vscode-editor-background);
        }

        .control-buttons { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

        .control-buttons button {
            background: transparent;
            border: none;
            color: var(--vscode-icon-foreground);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

        .control-buttons button:hover { background: var(--vscode-toolbar-hoverBackground); color: var(--vscode-foreground); }

        #send-btn {
            background: var(--vscode-button-background) !important;
            color: var(--vscode-button-foreground) !important;
            border-radius: 4px !important;
        }
        #send-btn:hover {
            background: var(--vscode-button-hoverBackground) !important;
            transform: none !important;
        }
        #send-btn:disabled { opacity: 0.5; transform: none; }

        textarea {
            flex: 1;
            height: 48px;
            resize: none;
            background-color: transparent;
            color: var(--vscode-input-foreground);
            border: none;
            outline: none;
            font-family: var(--vscode-font-family);
            font-size: 13px;
            box-sizing: border-box;
            padding: 4px;
        }

        /* ============================================================
           SURGICAL REVIEW CARDS
           ============================================================ */
        .review-card {
            margin: 15px 0;
            border: 1.5px solid var(--vscode-focusBorder);
            border-radius: 10px;
            background: var(--vscode-editorWidget-background);
            overflow: hidden;
            box-shadow: var(--shadow-lift);
            display: flex;
            flex-direction: column;
            animation: popCard 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popCard {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .review-header {
            background: var(--vscode-sideBarSectionHeader-background);
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
            color: var(--vscode-textLink-foreground);
            border-bottom: 1px solid var(--vscode-widget-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-body { padding: 12px 15px; font-size: 12px; line-height: 1.5; display: flex; align-items: center; gap: 8px; }

        .review-actions-row {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--vscode-widget-border);
            background: rgba(0, 0, 0, 0.15);
        }

        .review-btn-accept { background: var(--vscode-charts-green) !important; color: white !important; flex: 1; justify-content: center; height: 28px; }
        .review-btn-reject { background: var(--vscode-charts-red) !important; color: white !important; flex: 1; justify-content: center; height: 28px; }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--vscode-textLink-foreground);
            animation: spin 0.8s linear infinite;
            transform-origin: 50% 50% !important;
            display: inline-block;
        }

        .spin, .codicon.spin {
            display: inline-block !important;
            transform-origin: 50% 50% !important;
            animation: spin 1s linear infinite !important;
            line-height: 1 !important;
            vertical-align: middle;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ============================================================
           LAYOUT SHELL
           ============================================================ */
        .main { display: flex; flex-direction: column; height: 100vh; width: 100%; box-sizing: border-box; position: relative; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: var(--vscode-sideBarSectionHeader-background);
            border-bottom: 1px solid var(--vscode-widget-border);
            flex-shrink: 0;
            height: 48px;
            box-sizing: border-box;
        }

        .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }

        .title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .actions { display: flex; gap: 6px; flex-shrink: 0; }

        #attach-btn.attached {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 1px solid transparent;
            padding: 4px 10px;
            font-family: var(--vscode-font-family);
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 24px;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }

        button:hover { background-color: var(--vscode-button-hoverBackground); }
        button.secondary { background-color: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
        button.secondary:hover { background-color: var(--vscode-button-secondaryHoverBackground); }
        button.danger { background-color: transparent; border: 1px solid var(--vscode-errorForeground); color: var(--vscode-errorForeground); }
        button.danger:hover { background-color: var(--vscode-errorForeground); color: #ffffff; }
        button:focus { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .integrity-badge {
            font-size: 10px;
            padding: 3px 9px;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background-color: var(--vscode-sideBar-background);
            border-right: 1px solid var(--vscode-widget-border);
            z-index: 10000;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            box-shadow: var(--shadow-lift);
        }

        .sidebar.visible { transform: translateX(0); }

        .sidebar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: none;
        }

        .sidebar-overlay.visible { display: block; }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--vscode-widget-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--vscode-sideBarSectionHeader-background);
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .history-list { flex: 1; overflow-y: auto; padding: 8px 0; }

        .history-item {
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid var(--vscode-widget-border);
            transition: background-color 0.1s ease;
        }

        .history-item:hover { background-color: var(--vscode-list-hoverBackground); }

        .history-prompt { font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-actions { display: flex; justify-content: space-between; align-items: center; font-size: 11px; opacity: 0.7; }
        .history-time { font-size: 10px; }

        .history-item .delete-btn { background: transparent; border: none; padding: 0 4px; color: var(--vscode-errorForeground); font-size: 14px; cursor: pointer; height: auto; }
        .history-item .delete-btn:hover { color: var(--vscode-errorForeground); }

        /* ============================================================
           CHAT STREAM — real discussion layout: bubbles alternate
           sides, each assistant turn carries its own mini avatar.
           ============================================================ */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            max-width: 260px;
            color: var(--vscode-descriptionForeground);
        }

        .empty-state-face {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .empty-state-face .mini-face {
            width: 44px;
            height: 44px;
            background: rgba(155, 89, 182, 0.12);
            border: 1px solid var(--bond-color);
            transform-origin: 70% 100%;
            animation: friendly-wave 2.2s ease-in-out infinite;
        }

        .empty-state-face .robot-face { width: 24px; height: 19px; }
        .empty-state-face .robot-eye { width: 3.5px; height: 3.5px; }

        @keyframes friendly-wave {
            0%, 60%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-8deg); }
            20% { transform: rotate(6deg); }
            30% { transform: rotate(-8deg); }
            40% { transform: rotate(6deg); }
            50% { transform: rotate(0deg); }
        }

        .empty-state h3 {
            color: var(--vscode-foreground);
            font-size: 14px;
            margin: 0 0 6px 0;
        }

        .empty-state p {
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
        }

        .message-wrapper {
            width: 100%;
            padding: 6px 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: bubbleIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper.user-msg-wrapper { justify-content: flex-end; }
        .message-wrapper.assistant-msg-wrapper { justify-content: flex-start; }

        .msg-avatar-slot { flex-shrink: 0; width: 26px; height: 26px; margin-bottom: 2px; }
        .msg-avatar-slot .mini-face {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(155, 89, 182, 0.12);
            border: 1px solid var(--agent-core);
            position: relative;
        }
        .msg-avatar-slot .mini-face .robot-face { width: 15px; height: 12px; }
        .msg-avatar-slot .mini-face .robot-eye { width: 2px; height: 2px; }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 82%;
            padding: 10px 13px;
            border-radius: var(--bubble-radius);
            box-sizing: border-box;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .msg-avatar {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            font-size: 12px;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .msg-avatar.assistant {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .user-message {
            background-color: var(--vscode-editor-inactiveSelectionBackground);
            color: var(--vscode-editor-foreground);
            border: 1px solid var(--vscode-widget-border);
            border-bottom-right-radius: 2px;
            margin-left: auto;
        }

        .assistant-message {
            background-color: var(--vscode-editorWidget-background);
            border: 1px solid var(--vscode-widget-border);
            border-left: 3px solid var(--vscode-textLink-foreground, #3794ff);
            border-bottom-left-radius: 2px;
        }

        .message-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: bold;
            opacity: 0.75;
            gap: 8px;
        }

        .message-header .msg-label { display: flex; align-items: center; gap: 5px; }
        .user-message .message-header { color: var(--vscode-descriptionForeground); }
        .assistant-message .message-header { color: var(--vscode-textLink-foreground, #3794ff); }

        .message-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s ease; }
        .message-wrapper:hover .message-actions { opacity: 0.85; }

        .msg-action-btn {
            background: rgba(0, 0, 0, 0.25) !important;
            border: none !important;
            width: 20px; height: 20px; padding: 0 !important;
            border-radius: 50% !important;
            color: inherit !important;
        }
        .msg-action-btn:hover { background: rgba(0, 0, 0, 0.45) !important; }
        .msg-action-btn.delete-msg-btn:hover {
            background: rgba(231, 76, 60, 0.4) !important;
            color: var(--vscode-errorForeground, #ff6b6b) !important;
        }

        .message-content {
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* Typing / thinking indicator bubble shown before first chunk arrives */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 2px;
        }
        .typing-bubble .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--agent-core);
            opacity: 0.5;
            animation: dot-bounce 1.1s ease-in-out infinite;
        }
        .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dot-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ============================================================
           CODE COLLAPSIBLE GRAPHICAL ENHANCEMENTS
           ============================================================ */
        .code-collapsible {
            background-color: var(--vscode-editor-background);
            border: 1px solid var(--vscode-widget-border);
            border-radius: 8px;
            margin: 12px 0;
            overflow: visible !important;
            width: 100%;
        }

        .code-summary {
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background-color: var(--vscode-keybindingTable-headerBackground);
            color: var(--vscode-foreground);
            font-size: 12px;
            user-select: none;
            border-bottom: 1px solid var(--vscode-widget-border);
            box-sizing: border-box;
            list-style: none;
            margin: 0;
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
            cursor: pointer;
        }

        .code-summary::-webkit-details-marker { display: none !important; }
        .code-summary::marker { display: none !important; content: "" !important; }

        .code-summary::before {
            content: '\25BC';
            font-size: 10px;
            margin-right: 10px;
            color: var(--vscode-icon-foreground);
            display: inline-block;
            transition: transform 0.2s;
        }

        details:not([open]) > .code-summary::before { transform: rotate(-90deg); }

        .summary-lang-label { font-weight: 800; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }

        .code-actions { display: flex; gap: 6px; align-items: center; }

        .code-action-btn {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 24px;
        }

        .code-action-btn:hover { background-color: var(--vscode-button-secondaryHoverBackground); }
        .code-action-btn.apply-btn { background-color: var(--vscode-button-background); color: var(--vscode-button-foreground); }
        .code-action-btn.apply-btn:hover { background-color: var(--vscode-button-hoverBackground); }
        .code-action-btn.applied { background-color: var(--vscode-charts-green) !important; color: white !important; }

        .code-collapsible > pre {
            margin: 0;
            padding: 0;
            max-height: 400px;
            overflow: auto;
            display: flex;
            flex-direction: row;
            width: 100%;
            background-color: var(--vscode-editor-background);
            box-sizing: border-box;
        }

        .code-line-gutter {
            flex-shrink: 0;
            width: 40px;
            text-align: right;
            padding: 12px 8px;
            color: var(--vscode-editor-lineNumbers-foreground);
            background-color: var(--vscode-editorGutter-background);
            user-select: none;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            border-right: 1px solid var(--vscode-editorGroup-border);
            line-height: 1.5;
            position: sticky;
            left: 0;
            z-index: 10;
            align-self: flex-start;
        }

        .code-collapsible > pre > code {
            flex: 1;
            display: block;
            padding: 12px;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            white-space: pre;
            background-color: transparent;
            box-sizing: border-box;
            line-height: 1.5;
            min-width: 0;
        }

        .plan-scratchpad {
            border-left: 3px solid var(--vscode-textLink-foreground, #3794ff);
            background: rgba(0, 0, 0, 0.15);
            margin-bottom: 8px;
            border-radius: 4px;
        }

        /* ============================================================
           MULTI-STEP APPLY ALL BAR & STEP CARDS
           Emitted when the LLM chains <add_files_to_context> /
           <deselect_context_files> / unmute calls in one turn (fast mode).
        .companion-step-card {
            margin: 6px 0;
            border: 1px solid var(--vscode-widget-border);
            border-left: 3px solid var(--agent-calm, #00d9b5);
            border-radius: 6px;
            background: rgba(0, 217, 181, 0.06);
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11.5px;
        }

        .companion-step-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: var(--agent-calm, #00d9b5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .companion-step-header .step-index {
            background: var(--agent-calm, #00d9b5);
            color: #06222a;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 9.5px;
            font-weight: 800;
        }

        .companion-step-body {
            font-family: var(--vscode-editor-font-family);
            font-size: 10.5px;
            opacity: 0.9;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .companion-step-body code {
            background: rgba(0, 0, 0, 0.2);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .apply-all-steps-bar {
            margin-top: 14px;
            margin-bottom: 4px;
            padding: 10px 14px;
            background: rgba(0, 217, 181, 0.08);
            border: 1.5px solid var(--agent-calm, #00d9b5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .apply-all-steps-bar .steps-bar-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--agent-calm, #00d9b5);
        }

        .apply-all-steps-bar .steps-bar-actions {
            display: flex;
            gap: 6px;
        }

            /* Multi-step apply bar + per-step state (MultiSteps_TASK orchestration) */
            .apply-multisteps-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 10px 14px;
                margin: 10px 0;
                border: 1.5px solid var(--agent-calm, #00d9b5);
                border-radius: 8px;
                background: rgba(0, 217, 181, .08);
                box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
            }

            .apply-multisteps-bar .ms-label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                font-weight: bold;
                color: var(--agent-calm, #00d9b5);
            }

            .apply-multisteps-bar .ms-progress {
                font-size: 11px;
                opacity: .9;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .apply-multisteps-bar .ms-actions {
                display: flex;
                gap: 6px;
            }

            .apply-multisteps-btn {
                height: 26px;
                font-size: 11px;
                padding: 0 10px;
            }

            .apply-multisteps-btn:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

            .companion-step-card[data-step-state="running"] {
                border-left-color: var(--vscode-charts-blue, #3794ff);
            }

            .companion-step-card[data-step-state="ok"] {
                border-left-color: var(--vscode-charts-green, #2ecc71);
                background: rgba(46, 204, 113, .06);
            }

            .companion-step-card[data-step-state="error"] {
                border-left-color: var(--vscode-charts-red, #e74c3c);
                background: rgba(231, 76, 60, .06);
            }

            .multisteps-banner {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                margin: 10px 0 6px 0;
                background: rgba(0, 217, 181, .08);
                border: 1px solid var(--agent-calm, #00d9b5);
                border-radius: 8px;
                font-size: 11px;
                font-weight: 700;
                color: var(--agent-calm, #00d9b5);
                text-transform: uppercase;
                letter-spacing: .3px;
            }

            .multisteps-banner .ms-warn {
                color: var(--vscode-charts-orange, #e67e22);
                font-weight: 600;
                margin-left: auto;
                text-transform: none;
                letter-spacing: 0;
            }

            .scratchpad-header {
                padding: 6px 12px;
                font-weight: bold;
                color: var(--vscode-textLink-foreground, #3794ff);
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 11px;
            }

            /* Implicit multi-step turn: appended once per turn at the end */
            .turn-multisteps-section {
                margin-top: 10px;
                padding: 10px 12px;
                border: 1px solid var(--vscode-widget-border);
                border-left: 3px solid var(--agent-calm, #00d9b5);
                border-radius: 8px;
                background: rgba(0, 217, 181, .04);
            }

            .turn-multisteps-section .turn-ms-title {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 11.5px;
                font-weight: 700;
                color: var(--agent-calm, #00d9b5);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: .3px;
            }

            .turn-multisteps-section .turn-ms-steps {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 8px;
            }

        .scratchpad-content { padding: 10px 15px; font-size: 11px; opacity: 0.9; background: rgba(0, 0, 0, 0.05); }

        .edit-overlay { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="sidebar-overlay" onclick="toggleHistory()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>History</span>
            <div>
                <button class="clear-btn" onclick="clearHistory()" title="Clear All" style="display:inline;">Clear</button>
                <button class="close-sidebar-btn" onclick="toggleHistory()" title="Close">✕</button>
            </div>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>
    <div class="main">
        <div class="header">
            <div class="header-left">
                <button class="secondary" onclick="toggleHistory()" title="Show History">
                    <span class="codicon codicon-history"></span>
                </button>
                <div class="companion-avatar" title="Lollms Companion">
                    <i class="codicon codicon-sparkle"></i>
                </div>
                <span class="title">Lollms Companion</span>
                <div class="integrity-badge" title="Operates with zero telemetry, protecting your IP.">
                    <span class="codicon codicon-shield"></span> Zero-Telemetry
                </div>
            </div>
            <div class="actions" style="display:flex; gap:8px;">
                <button class="secondary" id="attach-btn" onclick="toggleAttach()" title="Pin / Unpin to current active editor context">
                    <span class="codicon codicon-pin"></span>
                </button>
                <button class="secondary danger" onclick="clearResponse()" title="Clear Discussion"><span class="codicon codicon-trash"></span> Clear</button>
                <button class="secondary" onclick="copyFullResponse()" title="Copy Markdown"><span class="codicon codicon-copy"></span></button>
            </div>
        </div>

        <div class="content" id="markdown-content"></div>
        <div class="input-area-wrapper">
            <div class="input-area-container" id="input-container">
                <div class="input-area">
                    <div class="context-info" style="margin-bottom: 6px; font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--vscode-descriptionForeground);">
                        <span class="codicon codicon-file-code" style="color: var(--vscode-textLink-foreground);"></span>
                        <span id="context-info-text">Connecting to editor...</span>
                    </div>
                    <div class="rich-input-toolbar" style="border: none; border-radius: 0; background: transparent; padding: 2px 0; margin-bottom: 8px; border-bottom: 1px solid var(--vscode-widget-border);">
                        <button class="toolbar-tool" onclick="wrapText('python')" title="Python Block"><i class="codicon codicon-symbol-method"></i><span>Python</span></button>
                        <button class="toolbar-tool" onclick="wrapText('code')" title="Code Block"><i class="codicon codicon-code"></i><span>Code</span></button>
                        <div class="toolbar-separator"></div>
                        <button class="toolbar-tool" onclick="wrapText('h1')" title="Heading 1"><span>H1</span></button>
                        <button class="toolbar-tool" onclick="wrapText('h2')" title="Heading 2"><span>H2</span></button>
                        <button class="toolbar-tool" onclick="wrapText('h3')" title="Heading 3"><span>H3</span></button>
                        <div class="toolbar-separator"></div>
                        <button class="toolbar-tool" onclick="wrapText('list')" title="Bullet List"><i class="codicon codicon-list-unordered"></i></button>
                        <button class="toolbar-tool" onclick="wrapText('bold')" title="Bold"><i class="codicon codicon-bold"></i></button>
                        <button class="toolbar-tool" onclick="wrapText('italic')" title="Italic"><i class="codicon codicon-italic"></i></button>
                    </div>
                    <div class="input-row">
                        <div class="control-buttons">
                            <button id="moreActionsButton" title="Menu" onclick="toggleHistory()"><i class="codicon codicon-menu"></i></button>
                        </div>
                        <textarea id="prompt-input" placeholder="Ask a question or request a change..."></textarea>
                        <div class="control-buttons">
                            <button onclick="submitPrompt()" id="send-btn" title="Send Message"><i class="codicon codicon-send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script {{nonce}}>
        const vscode = acquireVsCodeApi();
        const container = document.getElementById('markdown-content');
        const promptInput = document.getElementById('prompt-input');

        let activeContentBuffer = "";
        let activePrompt = "";

        // Safe no-ops for deprecated animation handlers to prevent any runtime ReferenceError
        function setMood(mood) {}
        function setFaceMood(mood) {}
        function updateTrustScore(score) {}
        function setCognitiveMode(mode) {}
        window.setMood = setMood;
        window.setFaceMood = setFaceMood;
        window.updateTrustScore = updateTrustScore;
        window.setCognitiveMode = setCognitiveMode;

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function submitPrompt() {
            const text = promptInput.value.trim();
            if (text) {
                // Optimistic instant render: add the user bubble and typing indicator immediately
                renderUserBubble(text, 'user_' + Date.now());
                renderStreamingBubble('');
                container.scrollTop = container.scrollHeight;

                vscode.postMessage({
                    command: 'submitPrompt',
                    text: text
                });
                promptInput.value = '';
                promptInput.style.height = 'auto';
            }
        }

        function retryLastUserPrompt() {
            const lastUserWrapper = Array.from(document.querySelectorAll('.user-msg-wrapper')).pop();
            const text = lastUserWrapper ? lastUserWrapper.querySelector('.message-content')?.textContent?.trim() : '';
            if (text) {
                promptInput.value = text;
                submitPrompt();
            }
        }
        window.retryLastUserPrompt = retryLastUserPrompt;

        if (promptInput) {
            promptInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitPrompt();
                }
            });
        }

        function deleteMessage(id) {
            const wrapper = document.querySelector('.message-wrapper[data-message-id="' + id + '"]');
            if (wrapper) {
                wrapper.remove();
            }
            const remainingWrappers = document.querySelectorAll('.message-wrapper');
            if (remainingWrappers.length === 0) {
                if (container) {
                    container.innerHTML = '<div class="empty-state">' +
                        '<div style="font-size: 26px; opacity: 0.7; margin-bottom: 8px;"><i class="codicon codicon-sparkle"></i></div>' +
                        '<h3>Lollms Companion</h3>' +
                        '<p>Ask questions, request code changes, or ask where something is defined in the current file.</p>' +
                        '</div>';
                }
                _chatHistorySig = "";
                _chatStreamingEl = null;
            }
            vscode.postMessage({ command: 'deleteMessage', messageId: id });
        }
        window.deleteMessage = deleteMessage;

        function clearResponse() {
            activeContentBuffer = "";
            activePrompt = "";
            if (container) container.innerHTML = "";
            _respAssistantEl = null;
            _respPromptRendered = null;
            _chatHistorySig = null;
            _chatStreamingEl = null;
            window._lastAutoFocusedCode = null;
            vscode.postMessage({ command: 'clearActiveChat' });
        }

        function toggleAttach() {
            vscode.postMessage({ command: 'toggleAttach' });
        }

        function buildMessageDOM(role, id, rawContent) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + (role === 'user' ? 'user-msg-wrapper' : 'assistant-msg-wrapper');
            wrapper.dataset.messageId = id;
            if (rawContent !== undefined && rawContent !== null) {
                wrapper.dataset.originalContent = typeof rawContent === 'string' ? rawContent : JSON.stringify(rawContent);
            }

            const avatarSlot = document.createElement('div');
            avatarSlot.className = 'msg-avatar-slot';
            avatarSlot.innerHTML = role === 'user'
                ? '<div class="msg-avatar"><i class="codicon codicon-account"></i></div>'
                : '<div class="msg-avatar assistant"><i class="codicon codicon-sparkle"></i></div>';

            const message = document.createElement('div');
            message.className = 'message ' + (role === 'user' ? 'user-message' : 'assistant-message');

            const header = document.createElement('div');
            header.className = 'message-header';
            const label = document.createElement('span');
            label.className = 'msg-label';
            label.innerHTML = role === 'user'
                ? '<span class="codicon codicon-account"></span><span>You</span>'
                : '<span class="codicon codicon-sparkle"></span><span>Lollms</span>';
            const actions = document.createElement('div');
            actions.className = 'message-actions';
            actions.innerHTML = '<button class="msg-action-btn edit-msg-btn" title="Edit message" onclick="event.stopPropagation(); startEdit(this.closest(\'.message-wrapper\'), \'' + id + '\', \'' + role + '\')"><i class="codicon codicon-edit"></i></button>' +
                '<button class="msg-action-btn delete-msg-btn" title="Delete message" onclick="event.stopPropagation(); deleteMessage(\'' + id + '\')"><i class="codicon codicon-trash"></i></button>';
            header.appendChild(label);
            header.appendChild(actions);

            const body = document.createElement('div');
            body.className = role === 'user' ? 'message-content' : 'markdown-body message-content';

            message.appendChild(header);
            message.appendChild(body);

            if (role === 'user') {
                wrapper.appendChild(message);
                wrapper.appendChild(avatarSlot);
            } else {
                wrapper.appendChild(avatarSlot);
                wrapper.appendChild(message);
            }

            return { wrapper: wrapper, body: body };
        }

        // Tracks what's currently on screen so renderChat/renderResponse can patch
        // the DOM in place instead of wiping and rebuilding it on every streamed
        // chunk (a full teardown was the cause of the visible "blink").
        let _chatHistorySig = null;
        let _chatStreamingEl = null;

        function renderChat(history, streamingText) {
            if (!container) return;

            if ((!history || history.length === 0) && !streamingText) {
                container.innerHTML = '<div class="empty-state">' +
                    '<div style="font-size: 26px; opacity: 0.7; margin-bottom: 8px;"><i class="codicon codicon-sparkle"></i></div>' +
                    '<h3>Lollms Companion</h3>' +
                    '<p>Ask questions, request code changes, or ask where something is defined in the current file.</p>' +
                    '</div>';
                _chatHistorySig = "";
                _chatStreamingEl = null;
                return;
            }

            // Keep full content buffer synced for clipboard copy
            if (history && history.length > 0) {
                activeContentBuffer = history.map(m => (m.role === 'user' ? '### User:\n' : '### Assistant:\n') + m.content).join('\n\n');
            }
            if (streamingText) {
                activeContentBuffer = streamingText;
            }

            const historySig = JSON.stringify((history || []).map(m => [m.role, m.content.length]));
            if (historySig !== _chatHistorySig) {
                container.innerHTML = "";
                _chatStreamingEl = null;
                renderHistoryBubbles(history);
                _chatHistorySig = historySig;
            }

            renderStreamingBubble(streamingText);
            container.scrollTop = container.scrollHeight;
        }

        function sanitizeAiderMarkers(text) {
            if (!text) return '';
            return text
                .split('\n')
                .filter(line => {
                    const trimmed = line.trim();
                    if (/^<{7}\s*SEARCH$/.test(trimmed)) return false;
                    if (/^={5,}$/.test(trimmed)) return false;
                    if (/^>{7}\s*REPLACE$/.test(trimmed)) return false;
                    return true;
                })
                .join('\n');
        }

        function parseAiderHunks(rawBlock) {
            const hunks = [];
            if (!rawBlock || typeof rawBlock !== 'string') return hunks;

            const lines = rawBlock.replace(/\r\n/g, '\n').split('\n');
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                if (line.trim().startsWith('<<<<<<< SEARCH')) {
                    const startLineIdx = i;
                    const searchLines = [];
                    const replaceLines = [];
                    let inReplace = false;
                    let depth = 1;
                    let isClosed = false;

                    i++;
                    while (i < lines.length) {
                        const curLine = lines[i];
                        const trimmed = curLine.trim();

                        if (!inReplace) {
                            if (trimmed.startsWith('<<<<<<< SEARCH')) {
                                depth++;
                                searchLines.push(curLine);
                            } else if (trimmed.startsWith('>>>>>>> REPLACE')) {
                                if (depth > 1) depth--;
                                searchLines.push(curLine);
                            } else if (trimmed.startsWith('=======') && depth === 1) {
                                inReplace = true;
                                depth = 0;
                            } else {
                                searchLines.push(curLine);
                            }
                        } else {
                            if (trimmed.startsWith('<<<<<<< SEARCH')) {
                                if (depth === 0) {
                                    isClosed = true;
                                    i--;
                                    break;
                                } else {
                                    depth++;
                                    replaceLines.push(curLine);
                                }
                            } else if (trimmed.startsWith('>>>>>>> REPLACE')) {
                                if (depth > 0) {
                                    depth--;
                                    replaceLines.push(curLine);
                                } else {
                                    isClosed = true;
                                    break;
                                }
                            } else if (trimmed.startsWith('=======') && depth === 0) {
                                i++;
                                continue;
                            } else {
                                replaceLines.push(curLine);
                            }
                        }
                        i++;
                    }

                    if (isClosed || inReplace) {
                        const searchPart = sanitizeAiderMarkers(searchLines.join('\n'));
                        const replacePart = sanitizeAiderMarkers(replaceLines.join('\n'));
                        const fullMatch = lines.slice(startLineIdx, i + 1).join('\n');
                        hunks.push({
                            fullMatch: fullMatch,
                            searchPart: searchPart,
                            replacePart: replacePart,
                            startIndex: startLineIdx,
                            endIndex: i
                        });
                    }
                }
                i++;
            }

            return hunks;
        }

        function normalizeCompanionFileBlocks(text, defaultPath) {
            if (!text || typeof text !== 'string') return '';
            let result = text;
            const target = defaultPath || (window.activeFilePath || 'current_file');

            // If contains Aider markers without <file> tag, wrap into <file path="..." action="patch">
            if (result.includes('<<<<<<< SEARCH') && result.includes('>>>>>>> REPLACE') && !result.includes('<file')) {
                const fenceRegex = /```(?:[a-zA-Z0-9_\-]+)?(?::([^\r\n\s]+))?\r?\n(<<<<<<< SEARCH[\s\S]*?>>>>>>> REPLACE)\r?\n```/g;
                if (fenceRegex.test(result)) {
                    result = result.replace(fenceRegex, (match, p, body) => {
                        const fPath = p || target;
                        return '\n\n<file path="' + fPath + '" action="patch">\n' + body.trim() + '\n</file>\n\n';
                    });
                } else {
                    const aiderRegex = /(<<<<<<< SEARCH[\s\S]*?>>>>>>> REPLACE)/g;
                    result = result.replace(aiderRegex, (match) => {
                        return '\n\n<file path="' + target + '" action="patch">\n' + match.trim() + '\n</file>\n\n';
                    });
                }
            }

            return result;
        }

        function extractContextStepTags(text) {
            const steps = [];
            if (!text || typeof text !== 'string') return steps;

            const patterns = [
                { tag: 'add_files_to_context', icon: 'add', label: 'Unmute · Add Files to Context', group: 1 },
                { tag: 'deselect_context_files', icon: 'remove', label: 'Mute · Deselect Context Files', group: 1 },
                { tag: 'unmute_files', icon: 'unmute', label: 'Unmute Files', group: 1 },
                { tag: 'mute_files', icon: 'mute', label: 'Mute Files', group: 1 }
            ];

            for (const p of patterns) {
                const re = new RegExp('<' + p.tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + p.tag + '>', 'gi');
                let m;
                while ((m = re.exec(text)) !== null) {
                    const rawInner = (m[1] || '').trim();
                    if (!rawInner) continue;
                    steps.push({
                        tag: p.tag,
                        icon: p.icon,
                        label: p.label,
                        rawInner,
                        start: m.index,
                        end: m.index + m[0].length
                    });
                }
            }

            steps.sort((a, b) => a.start - b.start);
            return steps;
        }

        function renderCompanionStepCard(stepInfo, index) {
            const lines = stepInfo.rawInner
                .split(/\r?\n/)
                .map(l => l.replace(/^[-*+\d.\s]+/, '').trim())
                .filter(Boolean);

            const iconMap = {
                add: 'codicon-add',
                remove: 'codicon-remove',
                unmute: 'codicon-unmute',
                mute: 'codicon-mute'
            };
            const icon = iconMap[stepInfo.icon] || 'codicon-zap';

            const bodyHtml = lines.length > 0
                ? lines.map(l => '<code>' + escapeHtml(l) + '</code>').join(' ')
                : '<em style="opacity:0.7;">(no explicit files - model expanded the current selection)</em>';

            return '\n\n<div class="companion-step-card" data-step-tag="' + escapeHtml(stepInfo.tag) + '" data-step-index="' + index + '">' +
                '<div class="companion-step-header">' +
                    '<span class="step-index">STEP ' + (index + 1) + '</span>' +
                    '<i class="codicon ' + icon + '"></i>' +
                    '<span>' + escapeHtml(stepInfo.label) + '</span>' +
                '</div>' +
                '<div class="companion-step-body">' + bodyHtml + '</div>' +
            '</div>\n\n';
        }

        // --------------------------------------------------------------------
        // MULTI-STEP TASK (MultiSteps_TASK) parsing + rendering + apply bar
        // --------------------------------------------------------------------
        window.__multiStepsRegistry = window.__multiStepsRegistry || {};

        function extractMultiStepsBlocks(text) {
            const blocks = [];
            if (!text || typeof text !== 'string') return blocks;

            const outerRe = /<MultiSteps_TASK\b([^>]*)>([\s\S]*?)<\/MultiSteps_TASK>/gi;
            let om;
            while ((om = outerRe.exec(text)) !== null) {
                const attrStr = om[1] || '';
                const body = om[2] || '';
                const nbMatch = attrStr.match(/nb_steps\s*=\s*"(\d+)"/i) || attrStr.match(/nb_steps\s*=\s*'(\d+)'/i);
                const nbSteps = nbMatch ? parseInt(nbMatch[1], 10) : 0;

                const stepRe = /<step\b([^>]*)>([\s\S]*?)<\/step>/gi;
                const steps = [];
                let sm;
                let implicitIdx = 0;
                while ((sm = stepRe.exec(body)) !== null) {
                    implicitIdx++;
                    const stepAttrs = sm[1] || '';
                    const stepBody = sm[2] || '';
                    const numMatch = stepAttrs.match(/number\s*=\s*"(\d+)"/i) || stepAttrs.match(/number\s*=\s*'(\d+)'/i);
                    const number = numMatch ? parseInt(numMatch[1], 10) : implicitIdx;

                    const tfMatch = stepBody.match(/<target_files>([\s\S]*?)<\/target_files>/i);
                    const targets = tfMatch
                        ? tfMatch[1].split(/[\n,;]+/).map(s => s.trim()).filter(Boolean)
                        : [];

                    const insMatch = stepBody.match(/<instructions>([\s\S]*?)<\/instructions>/i);
                    const instructions = insMatch ? insMatch[1].trim() : stepBody.trim();

                    steps.push({
                        number,
                        targets,
                        instructions,
                        raw: stepAttrs + '\n' + stepBody
                    });
                }

                let malformed = false;
                if (steps.length === 0) {
                    malformed = true;
                    steps.push({ number: 1, targets: [], instructions: body.trim(), raw: body });
                }

                steps.sort((a, b) => a.number - b.number);
                const duplicates = steps.some((s, i) => i > 0 && s.number === steps[i - 1].number);
                const incomplete = nbSteps > 0 && steps.length < nbSteps;

                blocks.push({
                    index: om.index,
                    end: om.index + om[0].length,
                    nbSteps: nbSteps || steps.length,
                    steps,
                    duplicates,
                    incomplete,
                    malformed
                });
            }
            return blocks;
        }

        function renderMultiStepsBlock(groupId, parsed) {
            const bannerWarnings = [];
            if (parsed.duplicates) bannerWarnings.push('<span class="ms-warn">⚠ duplicate step numbers — Apply disabled</span>');
            if (parsed.incomplete) bannerWarnings.push('<span class="ms-warn">⚠ incomplete (' + parsed.steps.length + '/' + parsed.nbSteps + ')</span>');
            if (parsed.malformed) bannerWarnings.push('<span class="ms-warn">⚠ no &lt;step&gt; children — treated as single step</span>');

            const header = '<div class="multisteps-banner">' +
                '<i class="codicon codicon-layers"></i>' +
                '<span>Multi-Step Task · ' + parsed.steps.length + '/' + parsed.nbSteps + ' steps · ordered by number</span>' +
                bannerWarnings.join('') +
            '</div>';

            const stepCards = parsed.steps.map((s, i) => {
                const targetChips = s.targets.length > 0
                    ? s.targets.map(t => '<code>' + escapeHtml(t) + '</code>').join(' ')
                    : '<em style="opacity:.7;">(targets inferred from instructions)</em>';

                const lines = s.instructions.split(/\r?\n/);
                const preview = lines.slice(0, 3).join('\n');
                const hasMore = lines.length > 3;
                const instructionHtml = hasMore
                    ? '<div class="companion-step-body">' + escapeHtml(preview) + '…</div>' +
                      '<details style="margin-top:4px;"><summary style="cursor:pointer;font-size:10px;opacity:.75;">show full instructions</summary><div class="companion-step-body" style="margin-top:4px;white-space:pre-wrap;">' + escapeHtml(s.instructions) + '</div></details>'
                    : '<div class="companion-step-body">' + escapeHtml(preview) + '</div>';

                return '<div class="companion-step-card" data-step-number="' + s.number + '" data-multisteps-group="' + escapeHtml(groupId) + '" data-step-state="pending">' +
                    '<div class="companion-step-header">' +
                        '<span class="step-index">STEP ' + s.number + '</span>' +
                        '<i class="codicon codicon-symbol-event"></i>' +
                        '<span>' + (s.targets.length || 0) + ' target' + ((s.targets.length === 1) ? '' : 's') + '</span>' +
                    '</div>' +
                    '<div class="companion-step-body" style="margin-bottom:2px;">' + targetChips + '</div>' +
                    instructionHtml +
                '</div>';
            }).join('');

            const disabled = parsed.duplicates ? ' disabled' : '';
            const footer = '<div class="apply-multisteps-bar" data-ms-group="' + escapeHtml(groupId) + '">' +
                '<div class="ms-label"><i class="codicon codicon-layers" style="font-size:14px;"></i><span>' + parsed.steps.length + ' step' + (parsed.steps.length === 1 ? '' : 's') + ' ready</span></div>' +
                '<span class="ms-progress"></span>' +
                '<div class="ms-actions">' +
                    '<button class="apply-multisteps-btn primary-btn" data-ms-action="apply-all" data-ms-group="' + escapeHtml(groupId) + '"' + disabled + '>' +
                        '<i class="codicon codicon-check-all"></i> ' + (parsed.duplicates ? '⚠ Apply All Steps' : 'Apply All Steps (' + parsed.steps.length + ')') +
                    '</button>' +
                    '<button class="apply-multisteps-btn secondary-btn" data-ms-action="run-sequential" data-ms-group="' + escapeHtml(groupId) + '"' + disabled + '>' +
                        '<i class="codicon codicon-debug-start"></i> Run Sequentially' +
                    '</button>' +
                '</div>' +
            '</div>';

            return '\n\n' + header + stepCards + footer + '\n\n';
        }

        /**
         * Implicit multi-step turn grouping.
         * Rule: if >= 2 assistant messages in the SAME turn each contain at
         * least one <file> block, we treat the whole turn as a multi-step
         * turn and append ONE Apply-All-Steps bar at the END of the turn
         * (inside the last assistant message bubble — never per message).
         */
        function buildImplicitTurnSteps(turnMessages) {
            const messages = Array.isArray(turnMessages) ? turnMessages : [];
            const perMessageBlocks = messages.map(m => extractFileBlocks(typeof m?.text === 'string' ? m.text : ''));
            const messageCountWithFiles = perMessageBlocks.filter(b => b.length > 0).length;
            if (messageCountWithFiles < 2) return null;

            const steps = [];
            let counter = 0;
            perMessageBlocks.forEach((blocks, msgIdx) => {
                if (blocks.length === 0) return;
                counter += 1;
                const raw = blocks.map(b => '<file ' + b.attrStr + '>' + b.rawContent + '</file>

').join('\n');
                const targets = blocks.map(b => {
                    const pm = (b.attrStr || '').match(/(?:path|file_path|filepath|file|target|name|filename)\s*=\s*(?:["']([^"']+)["']|([^\s>]+))/i);
                    return pm ? (pm[1] || pm[2] || '').trim() : '';
                }).filter(Boolean);
                steps.push({
                    number: counter,
                    targets,
                    instructions: 'From assistant message #' + (msgIdx + 1) + ' (' + blocks.length + ' file block' + (blocks.length === 1 ? '' : 's') + ')',
                    raw
                });
            });
            return steps.length >= 2 ? steps : null;
        }

        function renderImplicitTurnBar(groupId, steps) {
            const stepCards = steps.map(s => {
                const chips = s.targets.length > 0
                    ? s.targets.map(t => '<code>' + escapeHtml(t) + '</code>').join(' ')
                    : '<em style="opacity:.7;">(no explicit path)</em>';
                return '<div class="companion-step-card" data-step-number="' + s.number + '" data-multisteps-group="' + escapeHtml(groupId) + '" data-step-state="pending">' +
                    '<div class="companion-step-header">' +
                        '<span class="step-index">STEP ' + s.number + '</span>' +
                        '<i class="codicon codicon-file-code"></i>' +
                        '<span>' + s.targets.length + ' file' + (s.targets.length === 1 ? '' : 's') + '</span>' +
                    '</div>' +
                    '<div class="companion-step-body">' + chips + '</div>' +
                '</div>';
            }).join('');

            return '\n\n<div class="turn-multisteps-section" data-ms-turn-group="' + escapeHtml(groupId) + '">' +
                '<div class="turn-ms-title"><i class="codicon codicon-layers"></i> Multi-Step Turn · ' + steps.length + ' message' + (steps.length === 1 ? '' : 's') + ' with file changes</div>' +
                '<div class="turn-ms-steps">' + stepCards + '</div>' +
                '<div class="apply-multisteps-bar" data-ms-group="' + escapeHtml(groupId) + '">' +
                    '<div class="ms-label"><i class="codicon codicon-layers" style="font-size:14px;"></i><span>' + steps.length + ' step' + (steps.length === 1 ? '' : 's') + ' ready</span></div>' +
                    '<span class="ms-progress"></span>' +
                    '<div class="ms-actions">' +
                        '<button class="apply-multisteps-btn primary-btn" data-ms-action="apply-all" data-ms-group="' + escapeHtml(groupId) + '">' +
                            '<i class="codicon codicon-check-all"></i> Apply All Steps (' + steps.length + ')' +
                        '</button>' +
                    '</div>' +
                '</div>' +
            '</div>\n\n';
        }

        function applyImplicitTurnGrouping(turnMessages, turnId) {
            if (!container) return false;
            const steps = buildImplicitTurnSteps(turnMessages);
            if (!steps) return false;

            const groupId = 'turn_' + turnId;
            window.__multiStepsRegistry[groupId] = { steps, duplicates: false, incomplete: false };

            // Find the LAST assistant bubble currently in the DOM.
            const assistantWrappers = container.querySelectorAll('.assistant-msg-wrapper');
            if (assistantWrappers.length === 0) return false;
            const lastWrapper = assistantWrappers[assistantWrappers.length - 1];
            const body = lastWrapper.querySelector('.message-content');
            if (!body) return false;

            // Guard: never double-append the same turn.
            if (body.querySelector('.turn-multisteps-section[data-ms-turn-group="' + groupId + '"]')) return true;

            const appendEl = document.createElement('div');
            appendEl.innerHTML = DOMPurify.sanitize(renderImplicitTurnBar(groupId, steps), {
                ADD_TAGS: ['div', 'button', 'span', 'i', 'code'],
                ADD_ATTR: ['class', 'style', 'data-ms-group', 'data-ms-turn-group', 'data-multisteps-group', 'data-step-number', 'data-step-state', 'data-ms-action']
            });
            body.appendChild(appendEl.firstElementChild);
            return true;
        }

        function applyMultiStepsReplacements(text, groupIdPrefix) {
            if (!text || typeof text !== 'string') return text;
            if (!/<MultiSteps_TASK/i.test(text)) return text;

            const blocks = extractMultiStepsBlocks(text);
            if (blocks.length === 0) return text;

            let processed = text;
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const groupId = groupIdPrefix + '_b' + i;
                window.__multiStepsRegistry[groupId] = {
                    steps: b.steps,
                    duplicates: b.duplicates,
                    incomplete: b.incomplete
                };
                processed = processed.substring(0, b.index) + renderMultiStepsBlock(groupId, b) + processed.substring(b.end);
            }
            return processed;
        }

        function renderCompanionStepsSummary(stepCount, groupKey) {
            return '<div class="apply-all-steps-bar" id="apply-all-steps-' + groupKey + '">' +
                '<div class="steps-bar-label">' +
                    '<i class="codicon codicon-layers" style="font-size: 16px;"></i>' +
                    '<span>Multi-Step Turn: ' + stepCount + ' context operation' + (stepCount === 1 ? '' : 's') + ' executed</span>' +
                '</div>' +
                '<div class="steps-bar-actions">' +
                    '<button class="code-action-btn secondary-btn" onclick="event.stopPropagation(); vscode.postMessage({command:\'requestApplyAllSteps\', groupKey:\'' + groupKey + '\'})" style="height: 26px; font-size: 11px; padding: 0 10px;" title="Re-run the follow-up prompt with the accumulated context">' +
                        '<i class="codicon codicon-debug-restart"></i> Re-Prompt with Context' +
                    '</button>' +
                '</div>' +
            '</div>';
        }

        function applyContextStepReplacements(text, groupKey) {
            if (!text || typeof text !== 'string') return { processed: text || '', stepCount: 0 };
            const steps = extractContextStepTags(text);
            if (steps.length === 0) return { processed: text, stepCount: 0 };

            let processed = text;
            for (let i = steps.length - 1; i >= 0; i--) {
                const s = steps[i];
                const card = renderCompanionStepCard(s, i);
                processed = processed.substring(0, s.start) + card + processed.substring(s.end);
            }
